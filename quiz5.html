<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>师生问卷 · 味味舍</title>
<style>
/* 返回按钮（加在顶部） */
.back-to-home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999;
    background: rgba(255,255,255,0.92);
    border: 1px solid #e8d5ce;
    border-radius: 30px;
    padding: 6px 16px;
    font-size: 13px;
    color: #c49a92;
    cursor: pointer;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
    text-decoration: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    backdrop-filter: blur(4px);
    transition: 0.2s;
}
.back-to-home:hover {
    background: #fdece8;
}

/* 以下保持原有样式不变 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', system-ui, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
}
.phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.04);
    margin: 0 auto;
}
.chat-list {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #ffffff;
}
.top-bar {
    padding: 50px 16px 10px 16px;
    background: #ffffff;
    border-bottom: 0.5px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.top-bar .title-area {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
}
.top-bar .title-area .badge {
    font-size: 12px;
    color: #999;
    font-weight: 400;
    margin-left: 6px;
}
.top-bar .settings-btn {
    width: 32px; height: 32px;
    background: #f0f0f0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: #555;
    transition: 0.15s;
    border: none;
}
.top-bar .settings-btn:hover { background: #e5e5e5; }
.search-bar {
    padding: 8px 16px 10px 16px;
    background: #ffffff;
}
.search-bar input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 30px;
    border: none;
    background: #f2f2f2;
    font-size: 15px;
    color: #1a1a1a;
    outline: none;
    transition: 0.2s;
}
.search-bar input::placeholder { color: #aaaaaa; }
.search-bar input:focus { background: #eaeaea; }
.list-area {
    flex: 1;
    overflow-y: auto;
    background: #ffffff;
}
.chat-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    transition: 0.1s;
    border-bottom: 0.5px solid #f0f0f0;
    position: relative;
}
.chat-item:hover { background: #f8f8f8; }
.chat-item:active { background: #efefef; }
.chat-item .avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #1a1a1a;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    font-weight: 500;
    position: relative;
}
.chat-item .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.chat-item .info {
    margin-left: 12px;
    flex: 1;
    min-width: 0;
}
.chat-item .info .name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.chat-item .info .name {
    font-size: 16px;
    font-weight: 500;
    color: #1a1a1a;
}
.chat-item .info .time {
    font-size: 11px;
    color: #b0b0b0;
}
.chat-item .info .last-msg {
    font-size: 13px;
    color: #9a9a9a;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-dialog {
    display: none;
    flex-direction: column;
    height: 100vh;
    background: #ffffff;
}
.dialog-header {
    padding: 50px 16px 10px 16px;
    background: #ffffff;
    border-bottom: 0.5px solid #e0e0e0;
    display: flex;
    align-items: center;
}
.dialog-header .back-btn {
    width: 32px; height: 32px;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
}
.dialog-header .dialog-name {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    flex: 1;
}
.dialog-header .dialog-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #1a1a1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
}
.dialog-header .dialog-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.msg-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #ffffff;
}
.msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
}
.msg-row.left { align-self: flex-start; }
.msg-row.right { align-self: flex-end; flex-direction: row-reverse; }
.msg-row .bubble {
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.msg-row.left .bubble {
    background: #f2f2f2;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
}
.msg-row.right .bubble {
    background: #1a1a1a;
    color: #ffffff;
    border-bottom-right-radius: 4px;
}
.msg-row .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #1a1a1a;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
}
.msg-row .msg-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.input-area {
    padding: 8px 12px 28px 12px;
    background: #ffffff;
    border-top: 0.5px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.input-area .opt-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.input-area .opt-btn {
    padding: 8px 18px;
    border-radius: 30px;
    border: 1px solid #d0d0d0;
    background: #ffffff;
    font-size: 14px;
    color: #1a1a1a;
    cursor: pointer;
    transition: 0.12s;
    flex: 1;
    min-width: 80px;
    text-align: center;
}
.input-area .opt-btn:hover { background: #f5f5f5; border-color: #aaa; }
.input-area .opt-btn:active { background: #e8e8e8; }
.settings-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 30px;
}
.settings-panel {
    background: #ffffff;
    border-radius: 24px;
    width: 100%;
    max-width: 380px;
    padding: 28px 24px 20px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    animation: slideUp 0.3s ease-out;
}
@keyframes slideUp {
    0% { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}
.settings-panel h3 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 20px;
    text-align: center;
}
.settings-panel .setting-item {
    margin-bottom: 18px;
}
.settings-panel .setting-item label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
}
.settings-panel .setting-item .preview-row {
    display: flex;
    align-items: center;
    gap: 12px;
}
.settings-panel .setting-item .preview-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #1a1a1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    flex-shrink: 0;
}
.settings-panel .setting-item .preview-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
}
.settings-panel .setting-item .preview-bg {
    width: 48px; height: 48px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid #ddd;
    flex-shrink: 0;
}
.settings-panel .setting-item input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: 0.15s;
}
.settings-panel .setting-item input[type="text"]:focus {
    border-color: #1a1a1a;
}
.settings-panel .btn-change {
    padding: 8px 16px;
    border: 1px solid #d0d0d0;
    border-radius: 20px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: 0.12s;
    color: #555;
}
.settings-panel .btn-change:hover { background: #f5f5f5; }
.settings-panel .close-settings {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
    transition: 0.12s;
}
.settings-panel .close-settings:hover { background: #333; }
.app-cover {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ffffff;
    padding: 40px 30px;
}
.app-cover .cover-title {
    font-size: 26px;
    font-weight: 200;
    letter-spacing: 10px;
    color: #1a1a1a;
    margin-bottom: 30px;
}
.app-cover .cover-warning {
    border: 1px solid #e0e0e0;
    padding: 30px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    line-height: 1.9;
    color: #333;
    background: #fafafa;
    margin-bottom: 30px;
}
.app-cover .cover-warning strong {
    color: #1a1a1a;
    font-weight: 600;
}
.app-cover .cover-btns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
}
.app-cover .cover-btn {
    padding: 14px 44px;
    border-radius: 40px;
    border: 1px solid #1a1a1a;
    background: #ffffff;
    font-size: 15px;
    cursor: pointer;
    transition: 0.12s;
    letter-spacing: 3px;
    color: #1a1a1a;
}
.app-cover .cover-btn.primary {
    background: #1a1a1a;
    color: #fff;
}
.app-cover .cover-btn:hover { opacity: 0.8; }
.app-cover .cover-btn:active { transform: scale(0.97); }
.hidden-input { display: none; }
.end-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.25);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 30px;
}
.end-panel {
    background: #ffffff;
    border-radius: 24px;
    max-width: 360px;
    width: 100%;
    padding: 30px 24px 20px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.06);
    text-align: center;
    animation: slideUp 0.3s ease-out;
}
.end-panel .end-avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #1a1a1a;
    margin: 0 auto 12px auto;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
}
.end-panel .end-avatar img { width: 100%; height: 100%; object-fit: cover; }
.end-panel .end-msg {
    font-size: 16px;
    color: #1a1a1a;
    line-height: 1.7;
    margin: 12px 0 20px 0;
}
.end-panel .end-btn {
    padding: 12px 36px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.12s;
}
.end-panel .end-btn:hover { background: #333; }
.quiz-screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    background: #ffffff;
    padding: 0;
}
.quiz-header {
    padding: 50px 16px 10px 16px;
    background: #ffffff;
    border-bottom: 0.5px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.quiz-header .quiz-title {
    font-size: 16px;
    font-weight: 500;
    color: #1a1a1a;
}
.quiz-header .quiz-counter {
    font-size: 13px;
    color: #999;
    background: #f2f2f2;
    padding: 4px 16px;
    border-radius: 30px;
}
.quiz-body {
    flex: 1;
    padding: 20px 20px 12px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
.quiz-question {
    font-size: 20px;
    font-weight: 400;
    color: #1a1a1a;
    line-height: 1.6;
    padding: 16px 0 20px 0;
    border-bottom: 1px solid #f0f0f0;
    margin-bottom: 18px;
    min-height: 80px;
}
.quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.quiz-opt {
    padding: 14px 20px;
    border: 1.5px solid #e8e8e8;
    border-radius: 16px;
    background: #ffffff;
    font-size: 16px;
    color: #1a1a1a;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.4;
}
.quiz-opt:hover {
    border-color: #1a1a1a;
    background: #fafafa;
}
.quiz-opt.selected {
    border-color: #1a1a1a;
    background: #f0f0f0;
    font-weight: 500;
}
.quiz-opt:active { transform: scale(0.98); }
.punish-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #080000;
    z-index: 2000;
    overflow: hidden;
    pointer-events: none;
    display: none;
}
.punish-overlay .danmaku {
    position: absolute;
    font-size: 32px;
    font-weight: 900;
    color: #c92b14;
    text-shadow: 0 0 30px #ff2200, 0 0 10px #b30000;
    white-space: nowrap;
    opacity: 0.9;
    letter-spacing: 4px;
    pointer-events: none;
}
.punish-overlay .danmaku.d0 { animation: pLR 4s linear infinite; }
.punish-overlay .danmaku.d1 { animation: pRL 5s linear infinite; }
.punish-overlay .danmaku.d2 { animation: pTB 4.5s linear infinite; }
.punish-overlay .danmaku.d3 { animation: pBT 5.5s linear infinite; }
.punish-overlay .danmaku.d4 { animation: pDiag 5s linear infinite; }
.punish-overlay .danmaku.d5 { animation: pDiag2 4s linear infinite; }
@keyframes pLR {
    0% { transform: translateX(-120%) translateY(0); }
    100% { transform: translateX(120%) translateY(-20px); }
}
@keyframes pRL {
    0% { transform: translateX(120%) translateY(0); }
    100% { transform: translateX(-120%) translateY(20px); }
}
@keyframes pTB {
    0% { transform: translateY(-120%) translateX(0); }
    100% { transform: translateY(120%) translateX(30px); }
}
@keyframes pBT {
    0% { transform: translateY(120%) translateX(0); }
    100% { transform: translateY(-120%) translateX(-30px); }
}
@keyframes pDiag {
    0% { transform: translate(-120%, -120%); }
    100% { transform: translate(120%, 120%); }
}
@keyframes pDiag2 {
    0% { transform: translate(120%, -80%); }
    100% { transform: translate(-120%, 80%); }
}
.punish-overlay .fp {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(ellipse, #8a1a0a 0%, transparent 70%);
    opacity: 0.2;
    filter: blur(2px);
    pointer-events: none;
}
.punish-text {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2001;
    font-size: 52px;
    font-weight: 900;
    color: #c92b14;
    text-shadow: 0 0 60px #ff2200, 0 0 20px #b30000;
    text-align: center;
    letter-spacing: 8px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    animation: textFade 4s forwards;
}
@keyframes textFade {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
}
</style>
</head>
<body>

<!-- 返回按钮 -->
<a class="back-to-home" href="index.html">← 返回</a>

<div class="phone">

<!-- ==================== 聊天列表界面 ==================== -->
<div class="chat-list" id="chatList">
    <div class="top-bar">
        <div class="title-area">
            <span class="badge">     聊天框</span>
        </div>
        <button class="settings-btn" id="settingsOpen">⚙</button>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索聊天或小程序...">
    </div>
    <div class="list-area" id="listArea">
        <div class="chat-item" id="chatItemWhite">
            <div class="avatar" id="listAvatarWhite">
                <img id="listAvatarWhiteImg" src="" alt="">
            </div>
            <div class="info">
                <div class="name-row">
                    <span class="name" id="listNameWhite">白</span>
                    <span class="time" id="listTimeWhite">刚刚</span>
                </div>
                <div class="last-msg" id="listLastMsgWhite">在吗同学</div>
            </div>
        </div>
        <div class="chat-item" id="chatItemApp" style="display:none;">
            <div class="avatar" style="background:#1a1a1a;">
                <img id="appAvatarImg" src="" alt="" style="display:none;">
            </div>
            <div class="info">
                <div class="name-row">
                    <span class="name">知衡</span>
                    <span class="time">刚刚</span>
                </div>
                <div class="last-msg">小程序 · 点击进入</div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 聊天对话框 ==================== -->
<div class="chat-dialog" id="chatDialog">
    <div class="dialog-header">
        <button class="back-btn" id="dialogBack">‹</button>
        <span class="dialog-name" id="dialogName">白</span>
        <div class="dialog-avatar" id="dialogAvatar">
            <img id="dialogAvatarImg" src="" alt="">
        </div>
    </div>
    <div class="msg-area" id="msgArea"></div>
    <div class="input-area" id="inputArea">
        <div class="opt-btns" id="optBtns"></div>
    </div>
</div>

<!-- ==================== 知衡小程序封面 ==================== -->
<div class="app-cover" id="appCover">
    <div class="cover-title">知 衡</div>
    <div class="cover-warning">
        <strong>⚠ 警告 ⚠</strong><br><br>
        本程序包含对意志的试探、驯服与掌控。<br>
        所有内容均为虚构的支配/服从情境。<br>
        每一次选择都将被记录。<br>
        犹豫或拒绝将触发不可撤回的惩罚。<br><br>
        <span style="font-size:12px;color:#999;">请确认你自愿接受这场调教。</span>
    </div>
    <div class="cover-btns">
        <button class="cover-btn primary" id="startQuiz">开始</button>
        <button class="cover-btn" id="refuseStart">拒绝开始</button>
    </div>
</div>

<!-- ==================== 设置弹窗 ==================== -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
        <h3>设 置</h3>
        <div class="setting-item">
            <label>你的头像</label>
            <div class="preview-row">
                <div class="preview-avatar" id="previewMyAvatar">
                    <img id="previewMyImg" src="" alt="">
                </div>
                <button class="btn-change" id="changeMyAvatar">更换</button>
            </div>
        </div>
        <div class="setting-item">
            <label>你的备注名称</label>
            <input type="text" id="myNameInput" value="宝宝" maxlength="8">
        </div>
        <div class="setting-item">
            <label>聊天背景</label>
            <div class="preview-row">
                <div class="preview-bg" id="previewBg" style="background:#ffffff;"></div>
                <button class="btn-change" id="changeBg">更换</button>
            </div>
        </div>
        <div class="setting-item">
            <label>对方（老师）头像</label>
            <div class="preview-row">
                <div class="preview-avatar" id="previewTeacherAvatar" style="background:#1a1a1a;">
                    <img id="previewTeacherImg" src="" alt="">
                </div>
                <button class="btn-change" id="changeTeacherAvatar">更换</button>
            </div>
        </div>
        <div class="setting-item">
            <label>对方备注名称</label>

        document.querySelectorAll('.quiz-opt').forEach((el, i) => el.classList.toggle('selected', i === choice));

            refuseInQuiz++;
            triggerPunish(() => goNext(idx));
            return;
        }
        answerLock = true;
        setTimeout(() => goNext(idx), 200);

        punishOverlay.innerHTML = '';
        punishOverlay.style.display = 'block';
        const words = ['爱','你','我','的','只','能','属','于','逃','不','掉','永','远','占','有','奴','隶','乖','听','话','❤','♡','命','令','你','服','从','别','想','逃'];
        const directions = ['d0','d1','d2','d3','d4','d5'];
        const tops = [2,8,14,20,26,32,38,44,50,56,62,68,74,80,86,92,98];
        const lefts = [2,10,18,26,34,42,50,58,66,74,82,90,98];
        const count = 150 + Math.floor(Math.random() * 40);
        for (let i = 0; i < count; i++) {
            const span = document.createElement('span');
            span.className = 'danmaku ' + directions[i % directions.length];
            span.innerText = words[Math.floor(Math.random() * words.length)] + ' ';
            span.style.top = tops[Math.floor(Math.random() * tops.length)] + '%';
            span.style.left = lefts[Math.floor(Math.random() * lefts.length)] + '%';
            span.style.fontSize = (22 + Math.floor(Math.random() * 38)) + 'px';
            span.style.animationDuration = (3 + Math.random() * 4) + 's';
            span.style.animationDelay = (Math.random() * 2) + 's';
            punishOverlay.appendChild(span);
        }
        for (let i = 0; i < 35; i++) {
            const fp = document.createElement('div');
            fp.className = 'fp';
            fp.style.top = Math.random() * 95 + '%';
            fp.style.left = Math.random() * 95 + '%';
            fp.style.width = (30 + Math.random() * 80) + 'px';
            fp.style.height = (40 + Math.random() * 100) + 'px';
            fp.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
            punishOverlay.appendChild(fp);
        }
        const textDiv = document.createElement('div');
        textDiv.className = 'punish-text';
        textDiv.innerHTML = txtSet.join('<br>');
        document.body.appendChild(textDiv);
        const duration = 5000 + Math.floor(Math.random() * 1500);
        setTimeout(() => {
            punishOverlay.style.display = 'none';
            punishOverlay.innerHTML = '';
            if (textDiv.parentNode) textDiv.parentNode.removeChild(textDiv);
            isPunishing = false;
            if (callback) callback();
        }, duration);
    }

    function showEndMessage() {
        if (teacherAvatarDataURL) { endAvatarImg.src = teacherAvatarDataURL; endAvatarImg.style.display = 'block'; }
        endOverlay.style.display = 'flex';
        quizCompleted = true;
        document.getElementById('listLastMsgWhite').innerText = '乖孩子，你所有的选择我都看到了。';
    }

    startQuiz.onclick = function() {
        appCover.style.display = 'none';
        quizScreen.style.display = 'flex';
        quizIdx = 0; quizAnswers = []; refuseInQuiz = 0; isPunishing = false; quizStarted = true;
        renderQuiz(0);
        startHesitateTimer();
    };

    refuseStart.onclick = function() {
        triggerPunish(function() {
            appCover.style.display = 'none';
            quizScreen.style.display = 'flex';
            quizIdx = 0; quizAnswers = []; refuseInQuiz = 0; isPunishing = false; quizStarted = true;
            renderQuiz(0);
            startHesitateTimer();
        });
    };

    searchInput.addEventListener('input', function() {
        const val = searchInput.value.trim();
        if (val === '知衡' && dialogStep === 2 && !quizCompleted) {
            chatList.style.display = 'none';
            appCover.style.display = 'flex';
            searchInput.value = '';
        }
    });

    dialogBack.addEventListener('click', function() {
        chatDialog.style.display = 'none';
        chatList.style.display = 'flex';
    });

    loadSettings();
    applySavedSettings();
    console.log('知衡·完整版加载完成。');
})();
</script>
</body>
