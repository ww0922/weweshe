<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深插 · 频率光谱 · 味味舍</title>
    <style>
        /* 返回按钮 */
        .back-to-home {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 99999;
            background: rgba(43,20,20,0.9);
            border: 1px solid #6e2e2e;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 13px;
            color: #deb6b6;
            cursor: pointer;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .back-to-home:hover { background: #3d1c1c; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            padding: 16px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #2b1414;
            background-image: radial-gradient(circle at 20% 30%, #3d1c1c 0%, #1f0c0c 90%);
            padding: 28px 22px 36px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,160,122,0.2);
            border: 1px solid #6e2e2e;
            transition: border-color 0.2s;
        }
        .card.hot { border-color: #d94f4f; box-shadow: 0 0 40px #8b1a1a80; }
        .title {
            color: #deb6b6; font-weight: 400; letter-spacing: 2px;
            text-align: center; font-size: 14px; text-transform: uppercase;
            border-bottom: 1px solid #5e2a2a; padding-bottom: 14px; margin-bottom: 28px;
            display: flex; justify-content: space-between;
        }
        .title span:first-child { color: #b47373; }
        .title span:last-child { color: #d98c8c; font-weight: 300; }
        .bar-container {
            background: #120808; border-radius: 100px; height: 32px; padding: 4px;
            box-shadow: inset 0 3px 8px black; border: 1px solid #5a2a2a;
            margin-bottom: 12px; position: relative; overflow: hidden;
        }
        .bar-fill {
            height: 100%; width: 30%;
            background: linear-gradient(90deg, #a83030, #e55a5a, #ff8a7a, #e65a5a, #a83030);
            background-size: 300% 100%; border-radius: 100px;
            transition: width 0.08s ease, filter 0.1s;
            box-shadow: 0 0 20px #e65a5a80, inset 0 0 8px #ffbbaa;
            position: relative; min-width: 6%;
        }
        .bar-fill.peak-glow { filter: brightness(1.4) drop-shadow(0 0 18px #ff4f4f); }
        .wave-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; border-radius: 100px;
            background: repeating-linear-gradient(90deg, transparent 0px, rgba(255,180,150,0.08) 2px, transparent 6px, rgba(200,80,80,0.05) 8px);
            mix-blend-mode: overlay;
        }
        .meta-row {
            display: flex; justify-content: space-between;
            padding: 0 6px 12px 6px; color: #b47a7a;
            font-size: 13px; letter-spacing: 0.5px; font-weight: 300;
        }
        .meta-row .freq { color: #e6a0a0; font-weight: 400; }
        .meta-row .depth { color: #cc7a7a; }
        .slider-block { margin: 20px 0 18px; }
        input[type=range] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
            background: linear-gradient(90deg, #4d2121, #b33a3a, #d94f4f);
            border-radius: 10px; outline: none; border: none; box-shadow: inset 0 1px 3px black;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
            background: #ce5a5a; border-radius: 50%; border: 2px solid #ff9a8a;
            box-shadow: 0 0 15px #e64545, 0 0 30px #802b2b; cursor: grab; transition: 0.06s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #e86a6a; }
        input[type=range]::-moz-range-thumb { width: 22px; height: 22px; background: #d44f4f; border: 2px solid #ffaaa0; border-radius: 50%; cursor: pointer; }
        .status-box {
            background: #1f0e0e; border-left: 6px solid #b34141;
            padding: 16px 18px; border-radius: 24px;
            margin: 14px 0 18px; color: #eccaca; font-size: 16px;
            line-height: 1.6; min-height: 84px;
            box-shadow: inset 0 2px 6px #110707; border-right: 1px solid #482222;
            transition: border-left 0.2s, background 0.2s; word-break: break-word;
        }
        .status-box.peak { border-left-color: #ff5e5e; background: #2d1212; color: #ffdbdb; text-shadow: 0 0 8px #ff6868; }
        .legend { display: flex; justify-content: space-between; color: #9f6a6a; font-size: 12px; padding: 4px 8px 0; }
        .footer-note {
            margin-top: 22px; font-size: 13px; color: #8f6060; text-align: center;
            border-top: 1px solid #3f1f1f; padding-top: 16px; letter-spacing: 0.3px;
        }
        .footer-note i { color: #c97a7a; font-style: normal; }
        .bpm-badge { display: inline-block; background: #2f1515; padding: 2px 12px; border-radius: 40px; border: 1px solid #9f4a4a; color: #dd9a9a; font-weight: 300; }
    </style>
</head>
<body>
<a class="back-to-home" href="index.html">← 返回</a>
<div class="card" id="card">
    <div class="title">
        <span>⚡ 肉茎·频率仪</span>
        <span>🐚 腔内深度</span>
    </div>
    <div class="bar-container" id="barContainer">
        <div class="bar-fill" id="barFill"></div>
        <div class="wave-overlay"></div>
    </div>
    <div class="meta-row">
        <span class="freq" id="freqDisplay">💦 2.4 Hz</span>
        <span class="depth" id="depthDisplay">⤵ 抽送深度 71%</span>
    </div>
    <div class="slider-block">
        <input type="range" min="0.3" max="3.8" step="0.01" value="1.8" id="freqSlider">
        <div class="legend">
            <span>🐢 慢碾 · 磨穴</span>
            <span>🐇 猛干 · 捣宫</span>
        </div>
    </div>
    <div class="status-box" id="statusBox">💗 龟头刚挤进湿漉漉的穴口，嫩肉缠上来吸吮…</div>
    <div class="footer-note">
        <span class="bpm-badge" id="bpmBadge">⚡ 86 bpm</span>
        <i> · 每次顶弄都操进子宫口 · 淫纹刻在能量条上</i>
    </div>
</div>

<script>
    (function() {
        const card = document.getElementById('card');
        const barFill = document.getElementById('barFill');
        const freqDisplay = document.getElementById('freqDisplay');
        const depthDisplay = document.getElementById('depthDisplay');
        const statusBox = document.getElementById('statusBox');
        const slider = document.getElementById('freqSlider');
        const bpmBadge = document.getElementById('bpmBadge');

        const descriptions = [
            { min: 0, max: 16, text: '🥀 穴口刚吞进龟头，紧闭着绞颤…… 鸡巴浸在湿热里慢慢胀大' },
            { min: 16, max: 30, text: '🍂 顺着骚水往里滑，肉壁一圈圈勒着冠状沟，酸麻从尾椎爬上来' },
            { min: 30, max: 44, text: '💧 进到半根，小穴咬得又紧又烫——你屁股不自觉往后凑，想吞更深' },
            { min: 44, max: 58, text: '🌊 每次抽带出一圈媚肉，龟头重新碾过敏感点，水声咕唧咕唧响' },
            { min: 58, max: 72, text: '🔥 频率攀上来来，操得囊袋拍在阴唇上啪啪响——你里面开始痉挛' },
            { min: 72, max: 84, text: '💥 插到最深的宫颈口，龟头马眼被咬得发麻——你喊出声，逼水浇在龟棱上' },
            { min: 84, max: 92, text: '✨ 几乎整根没入，只留囊袋贴在外阴，每次顶弄都把子宫口撞得又酸又麻' },
            { min: 92, max: 100, text: '👑 峰值·龙根捣进子宫！你浑身颤抖高潮迭起，精水混着淫汁从交合处溅出。老子操烂你这张贪吃的逼……' },
        ];

        const peakText = '💦 子宫被龟头撑满，每记抽送都刮着最嫩的肉，你抓床单翻白眼，喊爸爸干死你… —— 骚水喷湿整根鸡巴';

        function getDescription(widthVal, freqVal) {
            if (widthVal >= 92) { return '👑 ' + peakText + ' (频率 ' + freqVal.toFixed(1) + ' Hz · 捅穿花心)'; }
            if (widthVal >= 84 && widthVal < 92) { return descriptions[6].text + ' 💢 龟头卡在宫口，整根都在跳'; }
            let desc = descriptions.find(d => widthVal >= d.min && widthVal < d.max);
            return desc ? desc.text : '💗 龟头刚挤进湿漉漉的穴口，嫩肉缠上来吸吮…';
        }

        function updateInterface() {
            const freq = parseFloat(slider.value);
            let rawWidth = (freq - 0.3) / (3.8 - 0.3) * 100;
            let width = Math.min(100, Math.max(8, rawWidth * 0.85 + 10 + Math.sin(Date.now() / 280) * 4 * (freq / 2.5)));
            const waveAmplitude = 4 + freq * 1.2;
            const wave = Math.sin(Date.now() / (120 - freq * 18) + freq * 2) * waveAmplitude * 0.6;
            let finalWidth = Math.min(98, Math.max(6, width + wave));
            const microTremor = Math.sin(Date.now() / 7 + freq * 12) * 1.2;
            finalWidth = Math.min(100, Math.max(5, finalWidth + microTremor));

            barFill.style.width = finalWidth + '%';
            const freqHz = (freq * 0.9 + 0.7 + Math.sin(Date.now() / 400) * 0.2).toFixed(1);
            freqDisplay.innerHTML = `💦 ${freqHz} Hz`;
            const depthPercent = Math.round(finalWidth);
            depthDisplay.innerHTML = `⤵ 抽送深度 ${depthPercent}%`;
            const bpm = Math.round( (freq * 30 + 40) + Math.sin(Date.now()/500)*3 );
            bpmBadge.innerHTML = `⚡ ${bpm} bpm`;

            let desc = '';
            if (finalWidth < 10) desc = '🥀 龟头刚抵住穴口，湿气透出来…… 还没进去，你夹了一下';
            else if (finalWidth >= 92) {
                desc = '👑 ' + peakText + ' (频率 ' + freqHz + ' Hz)';
                card.classList.add('hot');
                barFill.classList.add('peak-glow');
                statusBox.classList.add('peak');
            } else {
                desc = getDescription(finalWidth, freq);
                card.classList.remove('hot');
                barFill.classList.remove('peak-glow');
                statusBox.classList.remove('peak');
            }
            statusBox.textContent = desc;
        }

        let animFrame;
        function animateLoop() { updateInterface(); animFrame = requestAnimationFrame(animateLoop); }
        animateLoop();
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) { if (animFrame) cancelAnimationFrame(animFrame); }
            else { animateLoop(); }
        });
        setTimeout(() => { updateInterface(); }, 30);
    })();
</script>
</body>
</html>
