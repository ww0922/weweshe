<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深插 · 律动 · 味味舍</title>
    <style>
        /* 返回按钮 */
        .back-to-home {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 99999;
            background: rgba(43,20,20,0.9);
            border: 1px solid #6e2e2e;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 13px;
            color: #deb6b6;
            cursor: pointer;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .back-to-home:hover { background: #3d1c1c; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            padding: 16px;
        }
        .card {
            max-width: 620px;
            width: 100%;
            background: #2b1414;
            background-image: radial-gradient(circle at 20% 30%, #3d1c1c 0%, #1f0c0c 90%);
            padding: 28px 22px 36px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,160,122,0.2);
            border: 1px solid #6e2e2e;
            transition: border-color 0.2s;
        }
        .card.hot { border-color: #d94f4f; box-shadow: 0 0 40px #8b1a1a80; }
        .title {
            color: #deb6b6; font-weight: 400; letter-spacing: 2px;
            text-align: center; font-size: 14px; text-transform: uppercase;
            border-bottom: 1px solid #5e2a2a; padding-bottom: 14px; margin-bottom: 28px;
            display: flex; justify-content: space-between;
        }
        .title span:first-child { color: #b47373; }
        .title span:last-child { color: #d98c8c; font-weight: 300; }
        .bar-container {
            background: #120808; border-radius: 100px; height: 34px; padding: 4px;
            box-shadow: inset 0 3px 8px black; border: 1px solid #5a2a2a;
            margin-bottom: 12px; position: relative; overflow: hidden;
        }
        .bar-fill {
            height: 100%; width: 30%;
            background: linear-gradient(90deg, #a83030, #e55a5a, #ff8a7a, #e65a5a, #a83030);
            background-size: 300% 100%; border-radius: 100px;
            transition: width 0.05s ease, filter 0.1s;
            box-shadow: 0 0 20px #e65a5a80, inset 0 0 8px #ffbbaa;
            position: relative; min-width: 6%;
        }
        .bar-fill.peak-glow { filter: brightness(1.5) drop-shadow(0 0 22px #ff4f4f); }
        .wave-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; border-radius: 100px;
            background: repeating-linear-gradient(90deg, transparent 0px, rgba(255,180,150,0.08) 2px, transparent 6px, rgba(200,80,80,0.05) 8px);
            mix-blend-mode: overlay;
        }
        .meta-row {
            display: flex; justify-content: space-between;
            padding: 0 6px 8px 6px; color: #b47a7a;
            font-size: 13px; letter-spacing: 0.5px; font-weight: 300;
        }
        .meta-row .freq { color: #e6a0a0; font-weight: 400; }
        .meta-row .depth { color: #cc7a7a; }
        .stroke-counter { text-align: center; color: #9f6a6a; font-size: 12px; margin-bottom: 12px; letter-spacing: 0.5px; }
        .stroke-counter span { display: inline-block; background: #2a1414; padding: 3px 14px; border-radius: 40px; border: 1px solid #7a3a3a; }
        .stroke-counter .num { color: #e6a0a0; font-weight: 600; }
        .auto-indicator { text-align: center; margin: 6px 0 14px; color: #b47a7a; font-size: 12px; letter-spacing: 1px; }
        .auto-indicator span { display: inline-block; background: #2f1515; padding: 4px 16px; border-radius: 40px; border: 1px solid #7a3a3a; color: #dd9a9a; }
        .auto-indicator .dot { display: inline-block; width: 8px; height: 8px; background: #d94f4f; border-radius: 50%; margin-right: 6px; animation: pulse-dot 1.2s ease-in-out infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
        .status-box {
            background: #1f0e0e; border-left: 6px solid #b34141;
            padding: 16px 18px; border-radius: 24px;
            margin: 14px 0 18px; color: #eccaca; font-size: 16px;
            line-height: 1.7; min-height: 90px;
            box-shadow: inset 0 2px 6px #110707; border-right: 1px solid #482222;
            transition: border-left 0.2s, background 0.2s; word-break: break-word;
        }
        .status-box.peak { border-left-color: #ff5e5e; background: #2d1212; color: #ffdbdb; text-shadow: 0 0 8px #ff6868; }
        .footer-note {
            margin-top: 22px; font-size: 13px; color: #8f6060; text-align: center;
            border-top: 1px solid #3f1f1f; padding-top: 16px; letter-spacing: 0.3px;
        }
        .footer-note i { color: #c97a7a; font-style: normal; }
        .bpm-badge { display: inline-block; background: #2f1515; padding: 2px 12px; border-radius: 40px; border: 1px solid #9f4a4a; color: #dd9a9a; font-weight: 300; }
        .rhythm-bar { display: flex; justify-content: center; gap: 4px; margin: 8px 0 4px; height: 16px; }
        .rhythm-bar .rb { width: 5px; background: #6a2e2e; border-radius: 4px; transition: background 0.1s, height 0.1s; }
        .rhythm-bar .rb.active { background: #d94f4f; box-shadow: 0 0 8px #d94f4f; }
    </style>
</head>
<body>
<a class="back-to-home" href="index.html">← 返回</a>
<div class="card" id="card">
    <div class="title">
        <span>⚡ 肉茎·律动</span>
        <span>🐚 自动抽送</span>
    </div>
    <div class="bar-container" id="barContainer">
        <div class="bar-fill" id="barFill"></div>
        <div class="wave-overlay"></div>
    </div>
    <div class="meta-row">
        <span class="freq" id="freqDisplay">💦 1.2 Hz</span>
        <span class="depth" id="depthDisplay">⤵ 深度 35%</span>
    </div>
    <div class="stroke-counter">
        <span>🍆 已操 <span class="num" id="strokeCount">0</span> 下</span>
    </div>
    <div class="rhythm-bar" id="rhythmBar"></div>
    <div class="auto-indicator">
        <span><span class="dot"></span> 自动 · 每帧 5~6 秒</span>
    </div>
    <div class="status-box" id="statusBox">💗 龟头刚抵住湿漉漉的穴口，嫩肉已经迫不及待地翕张吸吮…</div>
    <div class="footer-note">
        <span class="bpm-badge" id="bpmBadge">⚡ 72 bpm</span>
        <i> · 每一下都捣进最深处 · 淫水顺着交合处往下淌</i>
    </div>
</div>

<script>
    (function() {
        const card = document.getElementById('card');
        const barFill = document.getElementById('barFill');
        const freqDisplay = document.getElementById('freqDisplay');
        const depthDisplay = document.getElementById('depthDisplay');
        const statusBox = document.getElementById('statusBox');
        const bpmBadge = document.getElementById('bpmBadge');
        const strokeCountEl = document.getElementById('strokeCount');
        const rhythmBar = document.getElementById('rhythmBar');

        const RHYTHM_COUNT = 20;
        for (let i = 0; i < RHYTHM_COUNT; i++) {
            const div = document.createElement('div');
            div.className = 'rb';
            div.style.height = (4 + Math.random() * 10) + 'px';
            rhythmBar.appendChild(div);
        }
        const rhythmEls = rhythmBar.querySelectorAll('.rb');

        let strokePhase = 0;
        let direction = 1;
        let strokeCount = 0;
        const BASE_STROKE_MS = 600;
        const BASE_WITHDRAW_MS = 400;
        let targetDepth = 30;
        let currentText = '';
        let lastTextChangeTime = performance.now();
        const TEXT_INTERVAL_MS = 5500;

        const textPool = {
            shallow: [
                '🥀 龟头刚抵住穴口，两片阴唇微微张开，湿气氤氲…… 你轻轻一挺，伞棱卡进了嫩肉里',
                '🌱 只在洞口浅浅地研磨，淫水顺着龟头往下淌，整个会阴都亮晶晶的',
                '🍂 小穴咬住半个龟头又松开口，像在品尝前液的咸腥味，吸得马眼发麻',
                '💧 你粗重地喘着气，龟头在穴口进进出出，每次只进去一小截，她却已经夹得死紧',
                '🥀 龟棱刮着阴道口那圈敏感的嫩肉，你腰肢轻颤，淫水开始往外冒',
            ],
            midShallow: [
                '🌊 又进去了一截，肉壁裹上来紧紧箍着茎身，热度烫得我尾椎发麻',
                '💦 小穴深处传来吸力，像婴儿吮奶一样嘬着龟头，忍不住又挺深了几分',
                '🔥 抽出时带出一圈鲜红的媚肉，再顶进去时水声咕唧——你里面已经湿透了',
                '🌊 茎身被层叠的肉褶包裹着，抽出时每一道皱褶都依依不舍地刮过冠状沟',
            ],
            midDeep: [
                '💥 插到一半以上了，龟头顶到一处格外紧窄的地方，你尖叫着缩紧——那是宫颈口',
                '✨ 放慢速度狠狠碾过那块凸起的G点，你整个人痉挛起来，淫水一股股浇在马眼上',
                '👑 每次顶弄都精准地撞在花心上，她语无伦次地浪叫，逼肉绞得你寸步难行',
                '🔥 频率越来越快，肉体拍打声和水声混在一起，整个床都在跟着你们的节奏摇晃',
            ],
            deep: [
                '💫 龟头挤进宫口了！那圈极紧的肉箍着冠状沟，每前进一毫米你都哆嗦一下',
                '🌋 子宫口像一张贪婪的小嘴咬住龟头前端吸吮，酥麻感从脊椎直冲天灵盖',
                '💥 整根没入只剩囊袋贴在你阴阜上，你尖叫着高潮，淫水从交合缝隙喷射出来',
                '👑 深插时小腹能感受到我体内的形状，这种亲密感让我发疯，一下比一下更用力',
            ],
            extreme: [
                '👑 龙根捣进子宫！我感觉龟头顶到了一片从未探索过的软肉，你弓起背尖叫着潮吹',
                '💦 淫水喷溅在你们的小腹上，你高潮时穴里像有生命一样绞着我吮吸，咬着牙继续干',
                '🌋 子宫被龟头顶得变了形，你哭着喊我，说"子宫要被操穿了"，听了反而更兴奋',
                '💥 极深的抽插让你的肚皮上隐隐显出龟头的形状，按在那里感受自己在体内的存在',
            ],
            entry: [
                '💗 龟头刚抵住湿漉漉的穴口，嫩肉已经迫不及待地翕张吸吮，像在说"快进来"',
                '🥀 扶着硬挺的肉茎在穴口滑动，沾满你的淫水后才慢慢挺入，你满足地叹了口气',
            ]
        };

        function getTextForDepth(depth) {
            if (depth < 8) return textPool.entry[Math.floor(Math.random() * textPool.entry.length)];
            else if (depth < 22) return textPool.shallow[Math.floor(Math.random() * textPool.shallow.length)];
            else if (depth < 42) return textPool.midShallow[Math.floor(Math.random() * textPool.midShallow.length)];
            else if (depth < 62) return textPool.midDeep[Math.floor(Math.random() * textPool.midDeep.length)];
            else if (depth < 82) return textPool.deep[Math.floor(Math.random() * textPool.deep.length)];
            else return textPool.extreme[Math.floor(Math.random() * textPool.extreme.length)];
        }

        function updateInterface(timestamp) {
            const strokeDuration = direction > 0 ? BASE_STROKE_MS : BASE_WITHDRAW_MS;
            const delta = 16.67 / strokeDuration;
            strokePhase += delta * direction;
            if (strokePhase >= 1) { strokePhase = 1; direction = -1; strokeCount++; strokeCountEl.textContent = strokeCount; }
            else if (strokePhase <= 0) { strokePhase = 0; direction = 1; }
            let eased;
            if (direction > 0) eased = 1 - Math.pow(1 - strokePhase, 1.6);
            else eased = Math.pow(strokePhase, 1.5);
            if (direction > 0 && strokePhase < 0.05) {
                const rand = Math.random();
                if (rand < 0.1) targetDepth = 15 + Math.random() * 20;
                else if (rand < 0.3) targetDepth = 50 + Math.random() * 25;
                else if (rand < 0.6) targetDepth = 70 + Math.random() * 20;
                else targetDepth = 82 + Math.random() * 16;
                targetDepth = Math.min(98, Math.max(12, targetDepth));
            }
            const baseStart = Math.max(5, targetDepth * 0.25);
            let depth = baseStart + (targetDepth - baseStart) * eased;
            const tremor = Math.sin(timestamp / 11 + strokePhase * 50) * 0.8;
            depth = Math.min(100, Math.max(4, depth + tremor));
            barFill.style.width = depth + '%';
            const freqHz = (1000 / (BASE_STROKE_MS + BASE_WITHDRAW_MS) * 2).toFixed(1);
            freqDisplay.innerHTML = `💦 ${freqHz} Hz`;
            const depthPercent = Math.round(depth);
            depthDisplay.innerHTML = `⤵ 深度 ${depthPercent}%`;
            const bpm = Math.round(60000 / (BASE_STROKE_MS + BASE_WITHDRAW_MS) * 2);
            bpmBadge.innerHTML = `⚡ ${bpm} bpm`;
            const activeIndex = Math.floor(strokePhase * RHYTHM_COUNT);
            rhythmEls.forEach((el, i) => { el.classList.toggle('active', i === activeIndex || i === activeIndex - 1); });
            const now = performance.now();
            if (now - lastTextChangeTime >= TEXT_INTERVAL_MS) {
                let newText = getTextForDepth(depth);
                if (newText !== currentText) { currentText = newText; statusBox.textContent = currentText; }
                lastTextChangeTime = now;
            }
            if (depth >= 90) { card.classList.add('hot'); barFill.classList.add('peak-glow'); statusBox.classList.add('peak'); }
            else { card.classList.remove('hot'); barFill.classList.remove('peak-glow'); statusBox.classList.remove('peak'); }
        }

        let animFrame;
        function animateLoop(timestamp) { updateInterface(timestamp); animFrame = requestAnimationFrame(animateLoop); }
        animFrame = requestAnimationFrame(animateLoop);
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) { if (animFrame) cancelAnimationFrame(animFrame); }
            else { lastTextChangeTime = performance.now(); animFrame = requestAnimationFrame(animateLoop); }
        });
        setTimeout(() => { currentText = textPool.entry[0]; statusBox.textContent = currentText; lastTextChangeTime = performance.now(); }, 50);
    })();
</script>
</body>
</html>
