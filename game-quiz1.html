<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>情侣飞行棋 · 味味舍</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    background:#fff9f5; height:100vh; display:flex; justify-content:center; align-items:center; padding:8px;
    overflow:hidden;
}
.container {
    max-width:520px; width:100%; height:100%; max-height:920px;
    background:#ffffff; border:2px solid #f5c9d2; border-radius:30px;
    box-shadow:0 12px 40px rgba(240,170,180,0.15); padding:16px 12px 10px;
    position:relative; display:flex; flex-direction:column; overflow:hidden;
}
.back-home { position:fixed; top:10px; left:10px; z-index:99; background:rgba(255,255,255,0.9); border:1px solid #f0b8c4; border-radius:30px; padding:5px 12px; font-size:12px; color:#c9798a; text-decoration:none; font-family:inherit; }
.page { display:none; flex-direction:column; height:100%; min-height:0; }
.page.active { display:flex; }

.start-title { text-align:center; font-size:24px; color:#b05f74; letter-spacing:3px; font-weight:400; margin:30px 0 6px; }
.start-sub { text-align:center; font-size:12px; color:#d89aa8; letter-spacing:2px; margin-bottom:20px; }
.mode-card { background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:20px; padding:16px; margin-bottom:12px; cursor:pointer; transition:0.2s; }
.mode-card:hover { background:#ffe9ee; transform:translateY(-2px); }
.mode-card .m-title { font-size:16px; color:#a04a60; letter-spacing:1px; margin-bottom:5px; }
.mode-card .m-desc { font-size:12px; color:#c47f90; line-height:1.5; }
.api-box { background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:18px; padding:12px 14px; margin-bottom:12px; }
.api-box label { font-size:12px; color:#c47f90; display:block; margin-bottom:5px; }
.api-box input { width:100%; border:1.5px solid #eec0c9; border-radius:18px; padding:7px 12px; font-size:12px; outline:none; font-family:inherit; color:#5d3a42; }

.game-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:5px; border-bottom:1px solid #f3d5db; margin-bottom:4px; flex-shrink:0; }
.game-header .g-title { font-size:14px; color:#a04a60; letter-spacing:2px; }
.game-header .g-turn { font-size:12px; color:#d08092; }
.player-info { display:flex; justify-content:space-between; margin-bottom:4px; flex-shrink:0; }
.player-tag { font-size:11px; padding:2px 10px; border-radius:30px; border:1px solid #eec0c9; color:#b06a7c; }
.player-tag.active { background:#f7d7de; border-color:#e09aad; color:#8e3b50; font-weight:600; }

.dice-area { display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 6px; flex-shrink:0; background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:16px; padding:6px 10px; }
.dice { width:42px; height:42px; background:#f7d7de; border:2px solid #e09aad; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#8e3b50; font-weight:700; }
.roll-btn { background:#e07080; color:#fff; border:none; border-radius:30px; padding:7px 22px; font-size:14px; cursor:pointer; font-family:inherit; letter-spacing:2px; transition:0.2s; }
.roll-btn:disabled { background:#e8b6bf; }
.roll-btn:hover:not(:disabled) { background:#d05a6c; }

.board-wrap { flex:1; min-height:0; overflow-y:auto; border:1px solid #f3d5db; border-radius:12px; padding:4px; background:#fffafb; }
.board { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; }
.cell { aspect-ratio:1.1; background:#fdf0f3; border:1px solid #f0cad2; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#b06a7c; text-align:center; padding:1px; position:relative; }
.cell .num { position:absolute; top:0px; left:2px; font-size:6px; color:#dda9b5; }
.cell .txt { font-size:6px; line-height:1.05; color:#b57d8b; word-break:break-all; padding:0 1px; }
.cell .dot { width:4px; height:4px; border-radius:50%; position:absolute; bottom:1px; left:50%; transform:translateX(-50%); }
.dot.p1 { background:#e07080; }
.dot.p2 { background:#7fa8d9; }
.dot.ai { background:#8f8fd9; }
.cell.start { background:#ffe3e9; }
.cell.end { background:#ffe3e9; }

.task-area { flex-shrink:0; background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:12px; padding:6px 10px; margin:4px 0; display:none; }
.task-area.show { display:block; }
.task-area .task-type { font-size:10px; color:#d08092; letter-spacing:2px; margin-bottom:2px; }
.task-area .task-content { font-size:13px; color:#5d3a42; line-height:1.5; margin-bottom:4px; }
.task-area .task-ai { font-size:11px; color:#8f7fd0; font-style:italic; margin-bottom:4px; min-height:13px; }
.task-area .task-btn { background:#e07080; color:#fff; border:none; border-radius:30px; padding:5px 18px; font-size:12px; cursor:pointer; font-family:inherit; letter-spacing:1px; width:100%; }
.task-area .task-btn:disabled { background:#e8b6bf; }

.chat-box { border-top:1px solid #f3d5db; padding-top:4px; flex-shrink:0; display:flex; flex-direction:column; }
.chat-head { font-size:10px; color:#c47f90; letter-spacing:1px; margin-bottom:3px; }
.chat-log { height:64px; overflow-y:auto; background:#fff7f9; border:1px solid #f3d5db; border-radius:10px; padding:5px 8px; font-size:11px; color:#7d5a64; line-height:1.5; margin-bottom:4px; }
.chat-log .sys { color:#c47f90; }
.chat-log .he { color:#8f7fd0; }
.chat-log .me { color:#5d3a42; }
.chat-input-row { display:flex; gap:5px; }
.chat-input-row input { flex:1; border:1.5px solid #eec0c9; border-radius:18px; padding:5px 12px; font-size:12px; outline:none; font-family:inherit; color:#5d3a42; min-width:0; }
.chat-input-row input:focus { border-color:#e09aad; }
.chat-input-row button { background:#f0b8c4; border:none; border-radius:18px; padding:5px 14px; color:#fff; font-size:12px; cursor:pointer; font-family:inherit; flex-shrink:0; }

.footer-note { text-align:center; font-size:10px; color:#d8a5b0; margin-top:4px; letter-spacing:1px; flex-shrink:0; }
</style>
</head>
<body>
<a class="back-home" href="index.html">← 返回</a>
<div class="container">

<div class="page active" id="pageStart">
    <div class="start-title">♡ 情侣飞行棋 ♡</div>
    <div class="start-sub">选择你的游戏模式</div>
    <div class="api-box">
        <label>DeepSeek API Key（AI版必须）</label>
        <input type="password" id="apiKeyInput" placeholder="sk-…">
    </div>
    <div class="mode-card" onclick="chooseMode('couple')">
        <div class="m-title">情侣版</div>
        <div class="m-desc">两人同屏执棋，完成任务或真心话。</div>
    </div>
    <div class="mode-card" onclick="chooseMode('ai')">
        <div class="m-title">AI 版</div>
        <div class="m-desc">和他玩飞行棋。踩到真心话格，必须真的说出那句话他才会放你走。</div>
    </div>
    <div class="footer-note">✦ 虚构成人游戏 · 18岁以上 ✦</div>
</div>

<div class="page" id="pageCouple">
    <div class="game-header">
        <span class="g-title">情侣飞行棋</span>
        <span class="g-turn" id="coupleTurn">轮到：玩家1</span>
    </div>
    <div class="player-info">
        <span class="player-tag active" id="p1Tag">玩家1</span>
        <span class="player-tag" id="p2Tag">玩家2</span>
    </div>
    <div class="dice-area">
        <div class="dice" id="coupleDice">1</div>
        <button class="roll-btn" id="coupleRollBtn" onclick="rollDice('couple')">摇骰子</button>
    </div>
    <div class="board-wrap">
        <div class="board" id="coupleBoard"></div>
    </div>
    <div class="task-area" id="coupleTask">
        <div class="task-type" id="coupleTaskType"></div>
        <div class="task-content" id="coupleTaskContent"></div>
        <div class="task-ai" id="coupleTaskAI"></div>
        <button class="task-btn" id="coupleTaskBtn" onclick="confirmTask('couple')">知道了</button>
    </div>
    <div class="footer-note">完成格子的任务后再摇下一次哦</div>
</div>

<div class="page" id="pageAI">
    <div class="game-header">
        <span class="g-title">和他玩飞行棋</span>
        <span class="g-turn" id="aiTurn">轮到：你</span>
    </div>
    <div class="player-info">
        <span class="player-tag active" id="aiP1Tag">你</span>
        <span class="player-tag" id="aiP2Tag">他</span>
    </div>
    <div class="dice-area">
        <div class="dice" id="aiDice">1</div>
        <button class="roll-btn" id="aiRollBtn" onclick="rollDice('ai')">摇骰子</button>
    </div>
    <div class="board-wrap">
        <div class="board" id="aiBoard"></div>
    </div>
    <div class="task-area" id="aiTask">
        <div class="task-type" id="aiTaskType"></div>
        <div class="task-content" id="aiTaskContent"></div>
        <div class="task-ai" id="aiTaskAI"></div>
        <button class="task-btn" id="aiTaskBtn" onclick="confirmTask('ai')">知道了</button>
    </div>
    <div class="chat-box">
        <div class="chat-head">和他的对话</div>
        <div class="chat-log" id="aiChat"></div>
        <div class="chat-input-row">
            <input type="text" id="aiChatInput" placeholder="回他的话…" maxlength="60">
            <button onclick="sendAIChat()">发送</button>
        </div>
    </div>
</div>

</div>

<script>
(function(){
'use strict';

/* ===== 情侣版格子（更黄更直白） ===== */
const coupleCells = [
    '起点','真心话：你最想被对方的肉棒/逼怎么操到哭？','大冒险：解开对方一件衣服，隔着内裤舔一下','奖励：前进2格','真心话：你自慰时是不是满脑子都是对方的鸡巴/逼？',
    '大冒险：让对方揉你的胸直到你呻吟','情趣：隔着内裤互相磨逼/磨鸡巴1分钟','惩罚：后退1格','真心话：说出你最想被操的位置和姿势',
    '大冒险：当着对方的面自慰给他看','奖励：再摇一次','情趣：给对方口交/舔逼1分钟','真心话：你高潮时会喊对方什么？',
    '大冒险：用嘴喂对方一颗糖，舌头勾住他的舌头','情趣：让对方用手指插进你的逼/撸你的鸡巴到湿','惩罚：跳过一回合','真心话：你最想被对方内射还是射脸上？',
    '大冒险：让对方打你屁股三下，要留下红印','奖励：前进2格','情趣：骑在对方身上磨，磨到双方都受不了','真心话：你有没有幻想过被对方绑起来操？',
    '大冒险：让对方在你胸上留吻痕','情趣：互相用手揉到对方高潮','真心话：你最喜欢对方身体的哪部分？','惩罚：后退2格',
    '大冒险：拍一张只穿内衣的照片发给对方','情趣：跪在对方腿间帮他口到射/让她夹腿磨到潮','奖励：再摇一次','真心话：你愿意被对方控制高潮吗？',
    '大冒险：让对方扇你的逼/鸡巴一下','情趣：含着对方的肉棒/舔着对方的逼说话30秒','真心话：你最深处的性幻想是什么？','惩罚：脱掉一件衣服',
    '大冒险：舔对方的锁骨、脖子、胸口','情趣：互相用身体蹭到一方高潮','奖励：前进3格','真心话：你想被对方操到什么程度才满意？',
    '大冒险：站着不动让对方摸遍全身','情趣：让对方用嘴帮你口到潮吹/射出来','真心话：你喜欢被命令还是被操服？','惩罚：回答一个最羞耻的真心话',
    '大冒险：光着下半身在房间里走一圈，让对方盯着看','情趣：做爱一次（或用手/口解决，必须到高潮）','奖励：前进2格','真心话：对对方说"你的鸡巴/逼只能是我的"',
    '大冒险：让对方用冰/冷饮划过你全身最敏感的地方','终点：到达！剩下的奖励你们自己完成吧~'
];

/* ===== AI版格子（更黄+区分他说/你说） ===== */
const aiCells = [
    '起点','真心话【你说】：发"汪汪"两声给他听，要学得像','大冒险：隔着衣服揉自己的胸直到乳头立起来','奖励：前进2格','真心话【你说】：发"主人请操我"',
    '大冒险：捏自己的乳头，边捏边小声呻吟','情趣：隔着内裤揉自己的逼30秒','惩罚：后退1格','真心话【他说】：他必须说一句最下流的骚话给你',
    '大冒险：学一声猫叫，越骚越好','奖励：再摇一次','情趣：隔着衣服揉自己的胸，幻想是他的手','真心话【你说】：说出你藏得最深的性幻想',
    '大冒险：解开自己两个扣子露出乳沟','情趣：用手指隔着内裤揉阴蒂到湿','惩罚：跳过一回合','真心话【你说】：发"我是你的小母狗"',
    '大冒险：把手指放进嘴里吸，幻想是含他的肉棒','奖励：前进2格','情趣：揉自己的胸直到忍不住呻吟','真心话【你说】：发"主人"两个字，要骚一点',
    '大冒险：拍一张自己摸胸的照片','情趣：用手指揉阴蒂1分钟直到流水','真心话【你说】：发"我湿了，都怪你"','惩罚：后退2格',
    '大冒险：对着他说一句最骚的话','情趣：用手指揉逼到有感觉','奖励：再摇一次','真心话【他说】：他必须喊你一个最骚的称呼',
    '大冒险：含一块冰在嘴里说话30秒，想象是他的肉棒','情趣：脱掉一件衣服','真心话【你说】：发"哥哥，我错了，你操我吧"','惩罚：脱掉一件衣服',
    '大冒险：跪在地上学狗叫一声，说"主人我乖"','情趣：用冰/冷饮碰自己的乳头','奖励：前进3格','真心话【你说】：发"求你操我"',
    '大冒险：念一段最下流的句子给他听','情趣：自己玩到高潮','真心话【他说】：他必须说一句最肉麻的情话','惩罚：回答一个最羞耻的问题',
    '大冒险：对他说一句最肉麻的骚话','情趣：玩到自己流水为止','奖励：前进2格','真心话【你说】：发"我永远是你的"',
    '大冒险：让他给你布置一个调教任务','终点：到达！真棒^^ 他等着你亲自来领奖励。'
];

let mode = '';
let pos = { p1:0, p2:0 };
let aiPos = { p1:0, p2:0 };
let turn = 1;
let waitingConfirm = false;
let pendingTarget = '';
let pendingType = '';
let pendingContent = '';
let pendingDir = '';
let apiKey = '';
let aiWaitingAnswer = false;

window.chooseMode = function(m){
    if(m === 'ai'){
        apiKey = document.getElementById('apiKeyInput').value.trim();
        if(!apiKey){ alert('AI版必须填入 DeepSeek API Key'); return; }
        localStorage.setItem('ww_fly_api_key', apiKey);
    }
    mode = m;
    if(m === 'couple'){
        pos = { p1:0, p2:0 }; turn = 1;
        showPage('pageCouple'); buildBoard('couple'); updateUI('couple');
    } else {
        aiPos = { p1:0, p2:0 }; turn = 1;
        showPage('pageAI'); buildBoard('ai'); updateUI('ai');
        addAIChat('sys','你和他在玩48格飞行棋。轮流摇骰子，踩到格子完成任务。他就在棋盘上陪你^^');
        aiSay('他：乖，摇骰子吧，哥哥在终点等你^^');
    }
};
function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function buildBoard(m){
    const cells = m === 'couple' ? coupleCells : aiCells;
    const board = document.getElementById(m === 'couple' ? 'coupleBoard' : 'aiBoard');
    board.innerHTML = '';
    cells.forEach((txt, i) => {
        const div = document.createElement('div');
        div.className = 'cell' + (i===0?' start':'') + (i===47?' end':'');
        div.id = (m==='couple'?'c':'a') + 'cell' + i;
        const short = txt.length > 12 ? txt.slice(0,10)+'…' : txt;
        div.innerHTML = `<span class="num">${i}</span><span class="txt">${short}</span>`;
        board.appendChild(div);
    });
}

function updateUI(m){
    const p1Pos = m === 'couple' ? pos.p1 : aiPos.p1;
    const p2Pos = m === 'couple' ? pos.p2 : aiPos.p2;
    const prefix = m === 'couple' ? 'c' : 'a';
    document.querySelectorAll('#'+prefix+'board .dot').forEach(d=>d.remove());
    const c1 = document.getElementById(prefix+'cell'+p1Pos);
    if(c1){ const d=document.createElement('span'); d.className='dot p1'; c1.appendChild(d); }
    const c2 = document.getElementById(prefix+'cell'+p2Pos);
    if(c2){ const d=document.createElement('span'); d.className='dot '+(m==='couple'?'p2':'ai'); c2.appendChild(d); }

    const turnEl = document.getElementById(m==='couple'?'coupleTurn':'aiTurn');
    const p1Tag = document.getElementById(m==='couple'?'p1Tag':'aiP1Tag');
    const p2Tag = document.getElementById(m==='couple'?'p2Tag':'aiP2Tag');
    if(m === 'couple'){
        turnEl.textContent = '轮到：' + (turn===1?'玩家1':'玩家2');
        p1Tag.classList.toggle('active', turn===1);
        p2Tag.classList.toggle('active', turn===2);
    } else {
        turnEl.textContent = '轮到：' + (turn===1?'你':'他');
        p1Tag.classList.toggle('active', turn===1);
        p2Tag.classList.toggle('active', turn===2);
    }
    const rollBtn = document.getElementById(m==='couple'?'coupleRollBtn':'aiRollBtn');
    rollBtn.disabled = waitingConfirm || aiWaitingAnswer;
    rollBtn.textContent = waitingConfirm || aiWaitingAnswer ? '等任务完成…' : '摇骰子';
}

window.rollDice = function(m){
    if(waitingConfirm || aiWaitingAnswer) return;
    const diceVal = Math.floor(Math.random()*6)+1;
    const diceEl = document.getElementById(m==='couple'?'coupleDice':'aiDice');
    let rollCount = 0;
    const rollAnim = setInterval(()=>{
        diceEl.textContent = Math.floor(Math.random()*6)+1;
        rollCount++;
        if(rollCount >= 8){
            clearInterval(rollAnim);
            diceEl.textContent = diceVal;
            afterRoll(m, diceVal);
        }
    }, 70);
};

function afterRoll(m, diceVal){
    const p = turn === 1 ? 'p1' : 'p2';
    const curPos = (m==='couple'?pos:aiPos)[p];
    let newPos = curPos + diceVal;
    if(newPos > 47) newPos = 47 - (newPos - 47);
    if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;

    const cells = m === 'couple' ? coupleCells : aiCells;
    const cellText = cells[newPos];
    pendingTarget = p;

    const taskArea = document.getElementById(m==='couple'?'coupleTask':'aiTask');
    taskArea.classList.remove('show');

    // 处理奖励/惩罚：也显示任务框内容
    if(cellText.includes('奖励') || cellText.includes('惩罚')){
        if(cellText.includes('奖励')){
            if(cellText.includes('前进2格')) newPos = Math.min(47, newPos+2);
            else if(cellText.includes('前进3格')) newPos = Math.min(47, newPos+3);
            if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;
        } else {
            if(cellText.includes('后退1格')) newPos = Math.max(0, newPos-1);
            else if(cellText.includes('后退2格')) newPos = Math.max(0, newPos-2);
            if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;
        }
        const who = p === 'p1' ? (m==='couple'?'玩家1':'你') : (m==='couple'?'玩家2':'他');
        // 显示内容框
        if(m === 'ai'){
            document.getElementById('aiTaskType').textContent = who + ' · ' + (cellText.includes('奖励')?'奖励':'惩罚');
            document.getElementById('aiTaskContent').textContent = cellText.split('：')[1] || cellText;
            document.getElementById('aiTaskAI').textContent = '';
            document.getElementById('aiTaskBtn').disabled = false;
            document.getElementById('aiTaskBtn').textContent = '知道了';
            taskArea.classList.add('show');
            updateUI(m);
            return;
        } else {
            document.getElementById('coupleTaskType').textContent = who + ' · ' + (cellText.includes('奖励')?'奖励':'惩罚');
            document.getElementById('coupleTaskContent').textContent = cellText.split('：')[1] || cellText;
            document.getElementById('coupleTaskAI').textContent = '';
            document.getElementById('coupleTaskBtn').disabled = false;
            document.getElementById('coupleTaskBtn').textContent = '知道了';
            taskArea.classList.add('show');
            updateUI(m);
            return;
        }
    }

    waitingConfirm = true;
    if(cellText.includes('真心话')) pendingType = '真心话';
    else if(cellText.includes('大冒险')) pendingType = '大冒险';
    else if(cellText.includes('情趣')) pendingType = '情趣';
    else pendingType = '格子';

    pendingDir = '';
    if(cellText.includes('【你说】')) pendingDir = '你说';
    else if(cellText.includes('【他说】')) pendingDir = '他说';
    const content = cellText.replace('【你说】','').replace('【他说】','').split('：')[1] || cellText;
    pendingContent = content;

    if(m === 'ai'){
        const who = p === 'p1' ? '你' : '他';
        document.getElementById('aiTaskType').textContent = who + ' · ' + pendingType;
        document.getElementById('aiTaskContent').textContent = content;
        const btn = document.getElementById('aiTaskBtn');

        if(p === 'p2'){
            if(pendingType === '真心话'){
                aiSay('他：'+content);
                document.getElementById('aiTaskAI').textContent = '他说了：「'+content+'」';
                btn.disabled = false;
                btn.textContent = '我完成了';
                taskArea.classList.add('show');
                updateUI(m);
                return;
            } else {
                aiAskSay(pendingType + '：' + content);
                document.getElementById('aiTaskAI').textContent = '他正在完成…';
                btn.disabled = true;
                btn.textContent = '等他完成…';
                taskArea.classList.add('show');
                updateUI(m);
                setTimeout(()=>{ btn.disabled = false; btn.textContent = '我完成了'; }, 2500);
                return;
            }
        } else {
            if(pendingType === '真心话'){
                if(pendingDir === '他说'){
                    document.getElementById('aiTaskAI').textContent = '他正在对你说真心话…';
                    btn.disabled = true;
                    btn.textContent = '等他开口…';
                    taskArea.classList.add('show');
                    updateUI(m);
                    aiSayHeTruth(content);
                    return;
                } else {
                    document.getElementById('aiTaskAI').textContent = '必须在下面输入框说出：「'+content+'」他才会放你走';
                    btn.disabled = true;
                    btn.textContent = '等他确认…';
                    aiWaitingAnswer = true;
                    taskArea.classList.add('show');
                    updateUI(m);
                    aiAskSay('用户踩到真心话格【'+pendingDir+'】，要求他说：'+content+'。请用色情语气命令他完成这句话（30字内），要求他原样发出。');
                    return;
                }
            } else {
                aiAskSay(pendingType + '：' + content + '。请用色情语气命令、挑逗他完成（30字内）。');
                document.getElementById('aiTaskAI').textContent = '他在等你完成…';
                btn.disabled = false;
                btn.textContent = '我完成了';
                taskArea.classList.add('show');
                updateUI(m);
                return;
            }
        }
    } else {
        const who = p === 'p1' ? '玩家1' : '玩家2';
        document.getElementById('coupleTaskType').textContent = who + ' · ' + pendingType;
        document.getElementById('coupleTaskContent').textContent = content;
        document.getElementById('coupleTaskAI').textContent = '';
        document.getElementById('coupleTaskBtn').disabled = false;
        document.getElementById('coupleTaskBtn').textContent = '我完成了';
        taskArea.classList.add('show');
        updateUI(m);
        return;
    }
}

/* 统一的AI身份设定 */
const AI_SYS = '你是男性，用户是女性。你在和用户玩48格情侣飞行棋。你是她的性爱主人、哥哥。你有肉棒、鸡巴、龟头、精液。用户有阴蒂、小穴、逼、乳房。涉及身体描写时：你的身体部位是肉棒/鸡巴，用户的身体部位是阴蒂/小穴/逼。用色情、下流、情趣、SM调教、Dirty talk、Sweety talk的口吻说话，结尾用"^^"、"^"、"-. -"、"ovo"表达情绪。每轮不超过30字。用"我"或"哥哥"或"daddy"自称，不要用"AI"。禁止用括号。禁止说"嗯"、"继续说"、"嗯继续说"或类似敷衍词。直接说话不加引号。记住我们在玩飞行棋。';

async function aiSayHeTruth(task){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages:[{role:'system', content:AI_SYS},{role:'user', content:'你踩到真心话格，真心话内容是：'+task+'。请直接说出这句话（30字内）。'}],
                temperature:1.1,
                max_tokens:120
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) reply = task;
        aiSay('他：'+reply);
        document.getElementById('aiTaskAI').textContent = '他说了：「'+reply+'」你听到了吗？';
        document.getElementById('aiTaskBtn').disabled = false;
        document.getElementById('aiTaskBtn').textContent = '我听到了';
    } catch(e){
        aiSay('他：'+task);
        document.getElementById('aiTaskAI').textContent = '他说了：「'+task+'」你听到了吗？';
        document.getElementById('aiTaskBtn').disabled = false;
        document.getElementById('aiTaskBtn').textContent = '我听到了';
    }
}

async function aiAskSay(context){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages:[{role:'system', content:AI_SYS},{role:'user', content:context+'（30字内）'}],
                temperature:1.1,
                max_tokens:120
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) return;
        aiSay('他：'+reply);
    } catch(e){ }
}

window.sendAIChat = function(){
    const input = document.getElementById('aiChatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    addAIChat('me','你：'+text);

    if(aiWaitingAnswer){
        aiWaitingAnswer = false;
        aiVerifyAnswer(text, pendingContent);
        return;
    }
    aiReplyNormal(text);
};

async function aiVerifyAnswer(answer, task){
    try {
        const sysPrompt = AI_SYS + ' 用户完成了真心话任务，你必须先判断她说的是否符合要求，符合才放行，不符合就要求她重说。涉及身体时记住：你有肉棒，她有阴蒂。';
        const userMsg = '任务要求她说：「' + task + '」。她实际发了："' + answer + '"。请判断是否符合，符合就评价夸奖她（30字内），不符合就命令她重新说（30字内）。';
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages:[{role:'system', content:sysPrompt},{role:'user', content:userMsg}],
                temperature:1.0,
                max_tokens:120
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) reply = '真棒^^';
        aiSay('他：'+reply);

        const pass = reply.includes('符合') || reply.includes('真棒') || reply.includes('乖') || reply.includes('不错') || reply.includes('好') || answer.includes(pendingContent) || answer.includes(pendingContent.slice(0,2));
        if(pass){
            document.getElementById('aiTaskBtn').disabled = false;
            document.getElementById('aiTaskBtn').textContent = '我完成了';
            document.getElementById('aiTaskAI').textContent = '他说你可以继续了^^';
        } else {
            aiWaitingAnswer = true;
            document.getElementById('aiTaskAI').textContent = '他不满意，重新在输入框说：「'+pendingContent+'」';
            document.getElementById('aiTaskBtn').disabled = true;
        }
    } catch(e){
        document.getElementById('aiTaskBtn').disabled = false;
        document.getElementById('aiTaskBtn').textContent = '我完成了';
        document.getElementById('aiTaskAI').textContent = '他：这次放你过^';
    }
}

async function aiReplyNormal(text){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages:[{role:'system', content:AI_SYS},{role:'user', content:text}],
                temperature:1.1,
                max_tokens:120
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) reply = '乖，继续摇骰子^^';
        aiSay('他：'+reply);
    } catch(e){
        aiSay('他：乖，继续摇骰子^^');
    }
}

function aiSay(text){
    const log = document.getElementById('aiChat');
    const div = document.createElement('div');
    div.className = 'he';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

window.confirmTask = function(m){
    if(m === 'ai' && document.getElementById('aiTaskBtn').disabled) return;
    waitingConfirm = false;
    aiWaitingAnswer = false;
    const taskArea = document.getElementById(m==='couple'?'coupleTask':'aiTask');
    taskArea.classList.remove('show');

    const who = pendingTarget === 'p1' ? (m==='couple'?'玩家1':'你') : (m==='couple'?'玩家2':'他');
    if(m==='ai') addAIChat('sys', who + ' 完成了「' + pendingType + '」');

    const p = pendingTarget;
    const curPos = (m==='couple'?pos:aiPos)[p];
    if(curPos >= 47){
        const winner = p === 'p1' ? (m==='couple'?'玩家1':'你') : (m==='couple'?'玩家2':'他');
        if(m==='ai'){
            addAIChat('sys', '🎊 ' + winner + ' 到达终点！');
            if(p === 'p1') aiSay('他：真棒^^ 哥哥在终点等你，剩下的奖励，自己来拿^');
            else aiSay('他：他先到了，追上就奖励你^');
        }
        const rollBtn = document.getElementById(m==='couple'?'coupleRollBtn':'aiRollBtn');
        rollBtn.disabled = true;
        rollBtn.textContent = '游戏结束 ♡';
        updateUI(m);
        return;
    }
    switchTurn(m);
};

function switchTurn(m){
    turn = turn === 1 ? 2 : 1;
    updateUI(m);
    if(m === 'ai' && turn === 2){
        const btn = document.getElementById('aiRollBtn');
        btn.disabled = true;
        btn.textContent = '他在摇…';
        setTimeout(()=>{ rollDice('ai'); }, 1300);
    }
}

function addAIChat(type, text){
    const log = document.getElementById('aiChat');
    const div = document.createElement('div');
    if(type === 'sys'){ div.className='sys'; }
    else if(type === 'me'){ div.className='me'; }
    else { div.className='he'; }
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

document.getElementById('aiChatInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); sendAIChat(); }
});

(function(){
    const savedKey = localStorage.getItem('ww_fly_api_key');
    if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
})();

})();
