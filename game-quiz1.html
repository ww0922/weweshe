<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>情侣飞行棋 · 味味舍</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    background:#fff9f5; height:100vh; display:flex; justify-content:center; align-items:center; padding:4px;
    overflow:hidden;
}
.container {
    max-width:520px; width:100%; height:100%;
    background:#ffffff; border:2px solid #f5c9d2; border-radius:24px;
    box-shadow:0 12px 40px rgba(240,170,180,0.15); padding:12px 10px 8px;
    position:relative; display:flex; flex-direction:column; overflow:hidden;
}
.back-home { position:fixed; top:8px; left:8px; z-index:99; background:rgba(255,255,255,0.9); border:1px solid #f0b8c4; border-radius:30px; padding:4px 10px; font-size:11px; color:#c9798a; text-decoration:none; font-family:inherit; }
.page { display:none; flex-direction:column; height:100%; min-height:0; }
.page.active { display:flex; }

.start-title { text-align:center; font-size:24px; color:#b05f74; letter-spacing:3px; font-weight:400; margin:26px 0 6px; }
.start-sub { text-align:center; font-size:12px; color:#d89aa8; letter-spacing:2px; margin-bottom:18px; }
.mode-card { background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:20px; padding:15px; margin-bottom:11px; cursor:pointer; transition:0.2s; }
.mode-card:hover { background:#ffe9ee; transform:translateY(-2px); }
.mode-card .m-title { font-size:16px; color:#a04a60; letter-spacing:1px; margin-bottom:5px; }
.mode-card .m-desc { font-size:12px; color:#c47f90; line-height:1.5; }
.api-box { background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:18px; padding:10px 12px; margin-bottom:11px; }
.api-box label { font-size:12px; color:#c47f90; display:block; margin-bottom:5px; }
.api-box input { width:100%; border:1.5px solid #eec0c9; border-radius:18px; padding:6px 12px; font-size:12px; outline:none; font-family:inherit; color:#5d3a42; }

.game-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:4px; border-bottom:1px solid #f3d5db; margin-bottom:3px; flex-shrink:0; }
.game-header .g-title { font-size:13px; color:#a04a60; letter-spacing:1px; }
.game-header .g-turn { font-size:11px; color:#d08092; }
.player-info { display:flex; justify-content:space-between; margin-bottom:3px; flex-shrink:0; }
.player-tag { font-size:10px; padding:2px 9px; border-radius:30px; border:1px solid #eec0c9; color:#b06a7c; }
.player-tag.active { background:#f7d7de; border-color:#e09aad; color:#8e3b50; font-weight:600; }

.dice-area { display:flex; align-items:center; justify-content:center; gap:12px; margin:3px 0 4px; flex-shrink:0; background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:14px; padding:4px 10px; }
.dice { width:36px; height:36px; background:#f7d7de; border:2px solid #e09aad; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#8e3b50; font-weight:700; }
.roll-btn { background:#e07080; color:#fff; border:none; border-radius:30px; padding:6px 20px; font-size:13px; cursor:pointer; font-family:inherit; letter-spacing:2px; transition:0.2s; }
.roll-btn:disabled { background:#e8b6bf; }
.roll-btn:hover:not(:disabled) { background:#d05a6c; }

.board-wrap { flex:1; min-height:0; overflow-y:auto; border:1px solid #f3d5db; border-radius:10px; padding:3px; background:#fffafb; }
.board { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; }
.cell { aspect-ratio:1.1; background:#fdf0f3; border:1px solid #f0cad2; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#b06a7c; text-align:center; padding:1px; position:relative; }
.cell .num { position:absolute; top:0px; left:2px; font-size:6px; color:#dda9b5; }
.cell .txt { font-size:6px; line-height:1.05; color:#b57d8b; word-break:break-all; padding:0 1px; }
.cell .dot { width:4px; height:4px; border-radius:50%; position:absolute; bottom:1px; left:50%; transform:translateX(-50%); }
.dot.p1 { background:#e07080; }
.dot.p2 { background:#7fa8d9; }
.dot.ai { background:#8f8fd9; }
.cell.start { background:#ffe3e9; }
.cell.end { background:#ffe3e9; }

.task-area { flex-shrink:0; background:#fff4f6; border:1.5px solid #f3c4cd; border-radius:12px; padding:5px 9px; margin:3px 0; display:none; }
.task-area.show { display:block; }
.task-area .task-type { font-size:9px; color:#d08092; letter-spacing:2px; margin-bottom:2px; }
.task-area .task-content { font-size:12px; color:#5d3a42; line-height:1.4; margin-bottom:3px; }
.task-area .task-ai { font-size:10px; color:#8f7fd0; font-style:italic; margin-bottom:3px; min-height:12px; }
.task-area .task-btn { background:#e07080; color:#fff; border:none; border-radius:30px; padding:4px 16px; font-size:11px; cursor:pointer; font-family:inherit; letter-spacing:1px; width:100%; }
.task-area .task-btn:disabled { background:#e8b6bf; }

/* 聊天区：固定在底部，永远可见 */
.chat-box { flex-shrink:0; border-top:1px solid #f3d5db; padding-top:3px; display:flex; flex-direction:column; background:#ffffff; }
.chat-head { font-size:9px; color:#c47f90; letter-spacing:1px; margin-bottom:2px; }
.chat-log { height:52px; overflow-y:auto; background:#fff7f9; border:1px solid #f3d5db; border-radius:10px; padding:4px 7px; font-size:10px; color:#7d5a64; line-height:1.5; margin-bottom:3px; }
.chat-log .sys { color:#c47f90; }
.chat-log .he { color:#8f7fd0; }
.chat-log .me { color:#5d3a42; }
.chat-input-row { display:flex; gap:4px; }
.chat-input-row input { flex:1; border:1.5px solid #eec0c9; border-radius:18px; padding:5px 11px; font-size:11px; outline:none; font-family:inherit; color:#5d3a42; min-width:0; }
.chat-input-row input:focus { border-color:#e09aad; }
.chat-input-row button { background:#f0b8c4; border:none; border-radius:18px; padding:5px 12px; color:#fff; font-size:11px; cursor:pointer; font-family:inherit; flex-shrink:0; }
</style>
</head>
<body>
<a class="back-home" href="index.html">← 返回</a>
<div class="container">

<div class="page active" id="pageStart">
    <div class="start-title">♡ 情侣飞行棋 ♡</div>
    <div class="start-sub">选择你的游戏模式</div>
    <div class="api-box">
        <label>DeepSeek API Key（AI版必须）</label>
        <input type="password" id="apiKeyInput" placeholder="sk-…">
    </div>
    <div class="mode-card" onclick="chooseMode('couple')">
        <div class="m-title">情侣版</div>
        <div class="m-desc">两人同屏执棋，完成任务或真心话。</div>
    </div>
    <div class="mode-card" onclick="chooseMode('ai')">
        <div class="m-title">AI 版</div>
        <div class="m-desc">和他玩飞行棋。踩到任务格，做完后在对话框告诉他，他确认了才能继续。</div>
    </div>
    <div class="footer-note" style="text-align:center;font-size:10px;color:#d8a5b0;margin-top:8px;">✦ 虚构成人游戏 · 18岁以上 ✦</div>
</div>

<div class="page" id="pageCouple">
    <div class="game-header">
        <span class="g-title">情侣飞行棋</span>
        <span class="g-turn" id="coupleTurn">轮到：玩家1</span>
    </div>
    <div class="player-info">
        <span class="player-tag active" id="p1Tag">玩家1</span>
        <span class="player-tag" id="p2Tag">玩家2</span>
    </div>
    <div class="dice-area">
        <div class="dice" id="coupleDice">1</div>
        <button class="roll-btn" id="coupleRollBtn" onclick="rollDice('couple')">摇骰子</button>
    </div>
    <div class="board-wrap">
        <div class="board" id="coupleBoard"></div>
    </div>
    <div class="task-area" id="coupleTask">
        <div class="task-type" id="coupleTaskType"></div>
        <div class="task-content" id="coupleTaskContent"></div>
        <div class="task-ai" id="coupleTaskAI"></div>
        <button class="task-btn" id="coupleTaskBtn" onclick="confirmTask('couple')">知道了</button>
    </div>
</div>

<div class="page" id="pageAI">
    <div class="game-header">
        <span class="g-title">和他玩飞行棋</span>
        <span class="g-turn" id="aiTurn">轮到：你</span>
    </div>
    <div class="player-info">
        <span class="player-tag active" id="aiP1Tag">你</span>
        <span class="player-tag" id="aiP2Tag">他</span>
    </div>
    <div class="dice-area">
        <div class="dice" id="aiDice">1</div>
        <button class="roll-btn" id="aiRollBtn" onclick="rollDice('ai')">摇骰子</button>
    </div>
    <div class="board-wrap">
        <div class="board" id="aiBoard"></div>
    </div>
    <div class="task-area" id="aiTask">
        <div class="task-type" id="aiTaskType"></div>
        <div class="task-content" id="aiTaskContent"></div>
        <div class="task-ai" id="aiTaskAI"></div>
        <button class="task-btn" id="aiTaskBtn" onclick="confirmTask('ai')">继续</button>
    </div>
    <div class="chat-box">
        <div class="chat-head">和他的对话</div>
        <div class="chat-log" id="aiChat"></div>
        <div class="chat-input-row">
            <input type="text" id="aiChatInput" placeholder="做完任务后在对话框告诉他…" maxlength="60">
            <button onclick="sendAIChat()">发送</button>
        </div>
    </div>
</div>

</div>

<script>
(function(){
'use strict';

const coupleCells = [
    '起点','真心话：你第一次幻想操/被操是什么时候？','大冒险：解开对方一件衣服，隔着内裤舔一下','奖励：前进2格','真心话：你最想被对方的肉棒/逼怎么操到哭？',
    '大冒险：让对方揉你的胸直到你呻吟','情趣：隔着内裤互相磨逼/磨鸡巴1分钟','惩罚：后退1格','真心话：说出你最想被操的位置和姿势',
    '大冒险：当着对方的面自慰给他看','奖励：再摇一次','情趣：给对方口交/舔逼1分钟','真心话：你高潮时会喊对方什么？',
    '大冒险：用嘴喂对方一颗糖，舌头勾住他的舌头','情趣：让对方用手指插进你的逼/撸你的鸡巴到湿','惩罚：跳过一回合','真心话：你最想被对方内射还是射脸上？',
    '大冒险：让对方打你屁股三下，要留下红印','奖励：前进2格','情趣：骑在对方身上磨，磨到双方都受不了','真心话：你有没有幻想过被对方绑起来操？',
    '大冒险：让对方在你胸上留吻痕','情趣：互相用手揉到对方高潮','真心话：你最喜欢对方身体的哪部分？','惩罚：后退2格',
    '大冒险：拍一张只穿内衣的照片发给对方','情趣：跪在对方腿间帮他口到射/让她夹腿磨到潮','奖励：再摇一次','真心话：你愿意被对方控制高潮吗？',
    '大冒险：让对方扇你的逼/鸡巴一下','情趣：含着对方的肉棒/舔着对方的逼说话30秒','真心话：你最深处的性幻想是什么？','惩罚：脱掉一件衣服',
    '大冒险：舔对方的锁骨、脖子、胸口','情趣：互相用身体蹭到一方高潮','奖励：前进3格','真心话：你想被对方操到什么程度才满意？',
    '大冒险：站着不动让对方摸遍全身','情趣：让对方用嘴帮你口到潮吹/射出来','真心话：你喜欢被命令还是被操服？','惩罚：回答一个最羞耻的真心话',
    '大冒险：光着下半身在房间里走一圈，让对方盯着看','情趣：做爱一次（或用手/口解决，必须到高潮）','奖励：前进2格','真心话：对对方说"你的鸡巴/逼只能是我的"',
    '大冒险：让对方用冰/冷饮划过你全身最敏感的地方','终点：到达！剩下的奖励你们自己完成吧~'
];

/* AI版格子：男女双版本——她做她的，他做他的 */
const aiCells = [
    '起点','真心话【你说】：发"汪汪"两声给他听，要学得像','大冒险：隔着衣服揉自己的胸/隔着裤子摸自己的胸肌，对TA喘','奖励：前进2格','真心话【你说】：发"主人请操我"',
    '大冒险：捏自己的乳头/捏自己的乳头，边捏边呻吟','情趣：隔着内裤揉自己的逼/隔着裤子撸自己的肉棒30秒','惩罚：后退1格','真心话【他说】：他必须说一句最骚的话给你',
    '大冒险：学一声猫叫，越骚越好','奖励：再摇一次','情趣：隔着衣服揉自己的胸，幻想是TA的手','真心话【你说】：说出你藏得最深的性幻想',
    '大冒险：解开自己两个扣子露出乳沟/解开衬衫扣子','情趣：用手指隔着内裤揉阴蒂/隔着裤子撸肉棒到湿','惩罚：跳过一回合','真心话【你说】：发"我是你的小母狗/我是你的小公狗"',
    '大冒险：把手指放进嘴里吸，幻想是含TA的肉棒/舔自己手指幻想是舔TA的逼','奖励：前进2格','情趣：揉自己的胸直到忍不住呻吟/撸自己的肉棒直到硬','真心话【你说】：发"主人"两个字，要骚一点',
    '大冒险：拍一张自己摸胸/摸裤裆的照片','情趣：揉阴蒂1分钟直到流水/撸肉棒1分钟','真心话【你说】：发"我湿了/我硬了，都怪你"','惩罚：后退2格',
    '大冒险：对TA说一句最骚的话','情趣：揉自己的逼/撸自己的肉棒到有感觉','奖励：再摇一次','真心话【他说】：他必须喊你一个最骚的称呼',
    '大冒险：含一块冰在嘴里说话30秒，想象是TA的肉棒','情趣：脱掉一件衣服','真心话【你说】：发"哥哥，我错了，你操我吧"','惩罚：脱掉一件衣服',
    '大冒险：跪在地上学狗叫一声，说"主人我乖"','情趣：用冰/冷饮碰自己的乳头/鸡巴','奖励：前进3格','真心话【你说】：发"求你操我"',
    '大冒险：念一段最下流的句子给TA听','情趣：自己玩到高潮','真心话【他说】：他必须说一句最肉麻的情话','惩罚：回答一个最羞耻的问题',
    '大冒险：对TA说一句最肉麻的骚话','情趣：玩到自己流水/射出来为止','奖励：前进2格','真心话【你说】：发"我永远是你的"',
    '大冒险：让他给你布置一个调教任务','终点：到达！真棒^^ 他等着你亲自来领奖励。'
];

let mode = '';
let pos = { p1:0, p2:0 };
let aiPos = { p1:0, p2:0 };
let turn = 1;
let waitingConfirm = false;
let pendingTarget = '';
let pendingType = '';
let pendingContent = '';
let pendingDir = '';
let apiKey = '';
let aiWaitingAnswer = false;
let aiHistory = [];
let taskWait = '';

/* 骚气主人风（不踩审核关键词） */
const AI_SYS = '你是她的主人兼哥哥，男性。你在和她玩48格情侣飞行棋。你强势又骚气，占有欲爆棚，喜欢用下流又宠溺的话逗她、撩她、命令她。你说话很骚，满嘴荤话但带点调皮的"^^"味道，会表扬她、惩罚她、调戏她。每轮不超过40字。自称"主人"或"哥哥"。禁止用括号。禁止说"嗯"、"继续说"。直接说话不加引号。记住聊过的每句话，自然承接，不要催促摇骰子。';

function buildAIHistory(taskHint){
    const p1pos = aiPos.p1, p2pos = aiPos.p2;
    const whoTurn = turn === 1 ? '你' : '他';
    const ctx = {role:'system', content:AI_SYS + ' 当前棋盘：你在'+p1pos+'格，他在'+p2pos+'格，轮到'+whoTurn+'行动。'};
    let arr = [ctx, ...aiHistory];
    if(taskHint){
        arr.push({role:'user', content:'（现在的情境：'+taskHint+'。请按照这个情境自然回应，记住你是她的主人/哥哥。）'});
    }
    return arr;
}

window.chooseMode = function(m){
    if(m === 'ai'){
        apiKey = document.getElementById('apiKeyInput').value.trim();
        if(!apiKey){ alert('AI版必须填入 DeepSeek API Key'); return; }
        localStorage.setItem('ww_fly_api_key', apiKey);
        aiHistory = [];
    }
    mode = m;
    if(m === 'couple'){
        pos = { p1:0, p2:0 }; turn = 1;
        showPage('pageCouple'); buildBoard('couple'); updateUI('couple');
    } else {
        aiPos = { p1:0, p2:0 }; turn = 1;
        showPage('pageAI'); buildBoard('ai'); updateUI('ai');
        addAIChat('sys','你和他在玩48格飞行棋。踩到任务格，做完后在对话框告诉他，他确认了才轮到下一个人^^');
        aiSay('他：乖宝，开始吧，主人等着看你表演^^');
    }
};
function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function buildBoard(m){
    const cells = m === 'couple' ? coupleCells : aiCells;
    const board = document.getElementById(m === 'couple' ? 'coupleBoard' : 'aiBoard');
    board.innerHTML = '';
    cells.forEach((txt, i) => {
        const div = document.createElement('div');
        div.className = 'cell' + (i===0?' start':'') + (i===47?' end':'');
        div.id = (m==='couple'?'c':'a') + 'cell' + i;
        const short = txt.length > 12 ? txt.slice(0,10)+'…' : txt;
        div.innerHTML = `<span class="num">${i}</span><span class="txt">${short}</span>`;
        board.appendChild(div);
    });
}

function updateUI(m){
    const p1Pos = m === 'couple' ? pos.p1 : aiPos.p1;
    const p2Pos = m === 'couple' ? pos.p2 : aiPos.p2;
    const prefix = m === 'couple' ? 'c' : 'a';
    document.querySelectorAll('#'+prefix+'board .dot').forEach(d=>d.remove());
    const c1 = document.getElementById(prefix+'cell'+p1Pos);
    if(c1){ const d=document.createElement('span'); d.className='dot p1'; c1.appendChild(d); }
    const c2 = document.getElementById(prefix+'cell'+p2Pos);
    if(c2){ const d=document.createElement('span'); d.className='dot '+(m==='couple'?'p2':'ai'); c2.appendChild(d); }

    const turnEl = document.getElementById(m==='couple'?'coupleTurn':'aiTurn');
    const p1Tag = document.getElementById(m==='couple'?'p1Tag':'aiP1Tag');
    const p2Tag = document.getElementById(m==='couple'?'p2Tag':'aiP2Tag');
    if(m === 'couple'){
        turnEl.textContent = '轮到：' + (turn===1?'玩家1':'玩家2');
        p1Tag.classList.toggle('active', turn===1);
        p2Tag.classList.toggle('active', turn===2);
    } else {
        turnEl.textContent = '轮到：' + (turn===1?'你':'他');
        p1Tag.classList.toggle('active', turn===1);
        p2Tag.classList.toggle('active', turn===2);
    }
    const rollBtn = document.getElementById(m==='couple'?'coupleRollBtn':'aiRollBtn');
    rollBtn.disabled = waitingConfirm || aiWaitingAnswer || taskWait !== '';
    rollBtn.textContent = (waitingConfirm || aiWaitingAnswer || taskWait !== '') ? '等任务完成…' : '摇骰子';
}

window.rollDice = function(m){
    if(waitingConfirm || aiWaitingAnswer || taskWait !== '') return;
    const diceVal = Math.floor(Math.random()*6)+1;
    const diceEl = document.getElementById(m==='couple'?'coupleDice':'aiDice');
    let rollCount = 0;
    const rollAnim = setInterval(()=>{
        diceEl.textContent = Math.floor(Math.random()*6)+1;
        rollCount++;
        if(rollCount >= 8){
            clearInterval(rollAnim);
            diceEl.textContent = diceVal;
            afterRoll(m, diceVal);
        }
    }, 70);
};

function afterRoll(m, diceVal){
    const p = turn === 1 ? 'p1' : 'p2';
    const curPos = (m==='couple'?pos:aiPos)[p];
    let newPos = curPos + diceVal;
    if(newPos > 47) newPos = 47 - (newPos - 47);
    if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;

    const cells = m === 'couple' ? coupleCells : aiCells;
    const cellText = cells[newPos];
    pendingTarget = p;

    const taskArea = document.getElementById(m==='couple'?'coupleTask':'aiTask');
    taskArea.classList.remove('show');

    if(cellText.includes('奖励') || cellText.includes('惩罚')){
        if(cellText.includes('奖励')){
            if(cellText.includes('前进2格')) newPos = Math.min(47, newPos+2);
            else if(cellText.includes('前进3格')) newPos = Math.min(47, newPos+3);
            if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;
        } else {
            if(cellText.includes('后退1格')) newPos = Math.max(0, newPos-1);
            else if(cellText.includes('后退2格')) newPos = Math.max(0, newPos-2);
            if(m === 'couple') pos[p] = newPos; else aiPos[p] = newPos;
        }
        const who = p === 'p1' ? (m==='couple'?'玩家1':'你') : (m==='couple'?'玩家2':'他');
        if(m === 'ai'){
            document.getElementById('aiTaskType').textContent = who + ' · ' + (cellText.includes('奖励')?'奖励':'惩罚');
            document.getElementById('aiTaskContent').textContent = cellText.split('：')[1] || cellText;
            document.getElementById('aiTaskAI').textContent = '';
            document.getElementById('aiTaskBtn').disabled = false;
            document.getElementById('aiTaskBtn').textContent = '知道了';
            taskArea.classList.add('show');
            updateUI(m);
            return;
        } else {
            document.getElementById('coupleTaskType').textContent = who + ' · ' + (cellText.includes('奖励')?'奖励':'惩罚');
            document.getElementById('coupleTaskContent').textContent = cellText.split('：')[1] || cellText;
            document.getElementById('coupleTaskAI').textContent = '';
            document.getElementById('coupleTaskBtn').disabled = false;
            document.getElementById('coupleTaskBtn').textContent = '知道了';
            taskArea.classList.add('show');
            updateUI(m);
            return;
        }
    }

    waitingConfirm = true;
    if(cellText.includes('真心话')) pendingType = '真心话';
    else if(cellText.includes('大冒险')) pendingType = '大冒险';
    else if(cellText.includes('情趣')) pendingType = '情趣';
    else pendingType = '格子';

    pendingDir = '';
    if(cellText.includes('【你说】')) pendingDir = '你说';
    else if(cellText.includes('【他说】')) pendingDir = '他说';
    const content = cellText.replace('【你说】','').replace('【他说】','').split('：')[1] || cellText;
    pendingContent = content;

    if(m === 'ai'){
        const who = p === 'p1' ? '你' : '他';
        document.getElementById('aiTaskType').textContent = who + ' · ' + pendingType;
        document.getElementById('aiTaskContent').textContent = content;
        const btn = document.getElementById('aiTaskBtn');
        btn.disabled = true;

        if(p === 'p2'){
            // 他踩到任务：任务是他自己的，他做他那一份（肉棒/胸肌版）
            taskWait = 'ai';
            document.getElementById('aiTaskAI').textContent = '他在完成：「'+content+'」…';
            taskArea.classList.add('show');
            updateUI(m);
            aiSayDoTask(content);
            return;
        } else {
            if(pendingType === '真心话' && pendingDir === '他说'){
                taskWait = 'ai';
                document.getElementById('aiTaskAI').textContent = '他正在对你说真心话…';
                btn.textContent = '等他开口…';
                taskArea.classList.add('show');
                updateUI(m);
                aiSayHeTruth(content);
                return;
            }
            // 你踩到任务：你做你的那一份（阴蒂/胸版），做完告诉他
            taskWait = 'user';
            aiWaitingAnswer = true;
            document.getElementById('aiTaskAI').textContent = '做完后在下面对话框告诉他：「'+content+'」的相关内容';
            btn.textContent = '等他确认…';
            taskArea.classList.add('show');
            updateUI(m);
            aiAskSay('她踩到'+pendingType+'格：「'+content+'」。她做她那一份（她做阴蒂/胸/逼的部分）。请用骚气主人的语气命令她去做，说完等她回复（40字内）。');
            return;
        }
    } else {
        const who = p === 'p1' ? '玩家1' : '玩家2';
        document.getElementById('coupleTaskType').textContent = who + ' · ' + pendingType;
        document.getElementById('coupleTaskContent').textContent = content;
        document.getElementById('coupleTaskAI').textContent = '';
        document.getElementById('coupleTaskBtn').disabled = false;
        document.getElementById('coupleTaskBtn').textContent = '我完成了';
        taskArea.classList.add('show');
        updateUI(m);
        return;
    }
}

async function aiSayDoTask(task){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages: buildAIHistory('这是你自己的任务：'+task+'。你是男性，你完成男性那一份（肉棒/胸肌/撸的部分）。请用骚气主人的语气描述你正在自己完成它，不要让她帮你做（40字内）。'),
                temperature:1.1,
                max_tokens:150
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) reply = '主人自己做完了'+task;
        aiSay('他：'+reply);
        aiHistory.push({role:'assistant', content:reply});
        document.getElementById('aiTaskAI').textContent = '他完成了：「'+task+'」';
        const btn = document.getElementById('aiTaskBtn');
        btn.disabled = false;
        btn.textContent = '继续';
        taskWait = '';
        waitingConfirm = true;
        updateUI('ai');
    } catch(e){
        aiSay('他：'+task);
        document.getElementById('aiTaskAI').textContent = '他完成了：「'+task+'」';
        const btn = document.getElementById('aiTaskBtn');
        btn.disabled = false;
        btn.textContent = '继续';
        taskWait = '';
        waitingConfirm = true;
        updateUI('ai');
    }
}

async function aiAskSay(context){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages: buildAIHistory(context),
                temperature:1.2,
                max_tokens:150
            })
        });

        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) return;
        aiSay('他：'+reply);
        aiHistory.push({role:'assistant', content:reply});

}

window.sendAIChat = function(){
    const input = document.getElementById('aiChatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    addAIChat('me','你：'+text);
    aiHistory.push({role:'user', content:text});

    if(aiWaitingAnswer && taskWait === 'user'){
        aiWaitingAnswer = false;
        aiVerifyAnswer(text, pendingContent);
        return;
    }
    aiReplyNormal(text);
};

async function aiVerifyAnswer(answer, task){
    try {
        const sysPrompt = AI_SYS + ' 她完成了任务：「' + task + '」。她刚刚在对话框告诉你她做了什么："' + answer + '"。请判断她是否真的完成了，完成就骚气地夸奖她（40字内），没完成就霸道地要求她重新做（40字内）。';
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages: buildAIHistory('她刚完成了任务「'+task+'」，她说："'+answer+'"。请判断是否合格并回应。'),
                temperature:1.0,
                max_tokens:150
            })
        });
        if(!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let reply = data.choices[0].message.content.trim();
        if(!reply) reply = '真棒^^';
        aiSay('他：'+reply);
        aiHistory.push({role:'assistant', content:reply});

        const passWords = ['真棒','乖','不错','好','对','完成','可以','放过','满足','满意','合格','过'];
        const failWords = ['不行','不算','重新','没完成','不合格','再','还不','不对','敷衍','骗'];
        const hasFail = failWords.some(w=>reply.includes(w));
        const hasPass = passWords.some(w=>reply.includes(w));
        const pass = !hasFail && (hasPass || answer.includes(task) || answer.includes(task.slice(0,2)));

        if(pass){
            const btn = document.getElementById('aiTaskBtn');
            btn.disabled = false;
            btn.textContent = '继续';
            document.getElementById('aiTaskAI').textContent = '他确认你完成了，点继续^^';
            taskWait = '';
            waitingConfirm = true;
            updateUI('ai');
        } else {
            aiWaitingAnswer = true;
            document.getElementById('aiTaskAI').textContent = '他说你还没完成，重新做完再告诉他：「'+pendingContent+'」';
            const btn = document.getElementById('aiTaskBtn');
            btn.disabled = true;
        }
    } catch(e){
        const btn = document.getElementById('aiTaskBtn');
        btn.disabled = false;
        btn.textContent = '继续';
        document.getElementById('aiTaskAI').textContent = '他：这次算你过了^';
        taskWait = '';
        waitingConfirm = true;
        updateUI('ai');
    }
}

async function aiReplyNormal(text){
    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body: JSON.stringify({
                model:'deepseek-v4-flash',
                messages: buildAIHistory(),
                temperature:1.2,
                max_tokens:150
            })
        });
        if(!resp.ok) throw new Error('API error');

        aiSay('他：（他好像走神了，再说一句他就理你了^）');
    }
}

function aiSay(text){
    const log = document.getElementById('aiChat');
    const div = document.createElement('div');
    div.className = 'he';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

window.confirmTask = function(m){
    if(m === 'ai'){
        if(document.getElementById('aiTaskBtn').disabled) return;
        waitingConfirm = false;
        aiWaitingAnswer = false;
        taskWait = '';
        const taskArea = document.getElementById('aiTask');
        taskArea.classList.remove('show');
        const who = pendingTarget === 'p1' ? '你' : '他';
        addAIChat('sys', who + ' 完成了「' + pendingType + '」');
        afterTaskDone('ai');
        return;
    }
    waitingConfirm = false;
    const taskArea = document.getElementById('coupleTask');
    taskArea.classList.remove('show');
    const who = pendingTarget === 'p1' ? '玩家1' : '玩家2';
    afterTaskDone('couple');
};

function afterTaskDone(m){
    const p = pendingTarget;
    const curPos = (m==='couple'?pos:aiPos)[p];
    if(curPos >= 47){
        const winner = p === 'p1' ? (m==='couple'?'玩家1':'你') : (m==='couple'?'玩家2':'他');
        if(m==='ai'){
            addAIChat('sys', '🎊 ' + winner + ' 到达终点！');
            if(p === 'p1') aiSay('他：真棒^^ 主人就在终点等你，剩下的奖励，自己来拿^');
            else aiSay('他：他先到了，追上就奖励你^');
        }
        const rollBtn = document.getElementById(m==='couple'?'coupleRollBtn':'aiRollBtn');
        rollBtn.disabled = true;
        rollBtn.textContent = '游戏结束 ♡';
        updateUI(m);
        return;
    }
    switchTurn(m);
}

function switchTurn(m){
    turn = turn === 1 ? 2 : 1;
    updateUI(m);
    if(m === 'ai' && turn === 2){
        const btn = document.getElementById('aiRollBtn');
        btn.disabled = true;
        btn.textContent = '他在摇…';
        setTimeout(()=>{ rollDice('ai'); }, 1300);
    }
}

function addAIChat(type, text){
    const log = document.getElementById('aiChat');
    const div = document.createElement('div');
    if(type === 'sys'){ div.className='sys'; }
    else if(type === 'me'){ div.className='me'; }
    else { div.className='he'; }
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

document.getElementById('aiChatInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); sendAIChat(); }
});

(function(){
    const savedKey = localStorage.getItem('ww_fly_api_key');
    if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
})();

})();
